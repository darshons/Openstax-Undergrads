<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenStax · Scenario Script Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>

<style>
  :root{
    --os-navy:#002569;
    --os-navy-ink:#0b1a3d;
    --os-orange:#f36f21;
    --os-orange-tint:#fde7d8;
    --os-green:#9ccb3b;
    --os-yellow:#f4c61f;
    --os-gray:#5e6a71;
    --os-line:#e6e8ec;
    --os-line-strong:#cdd2d9;
    --os-bg:#ffffff;
    --os-bg-2:#fafbfc;
    --os-bg-3:#f3f5f8;
    --os-ink:#1d2330;
    --os-ink-2:#4a525f;
    --os-ink-3:#7a828f;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
    --shadow-md:0 4px 14px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --shadow-lg:0 18px 48px -16px rgba(15,23,42,.18), 0 6px 16px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--os-bg-2);color:var(--os-ink);font-family:"Lato",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}

  /* ─── App shell ─── */
  .app{display:grid;grid-template-rows:60px 1fr;height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:#fff;border-bottom:1px solid var(--os-line);z-index:5}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{display:flex;flex-direction:column;gap:3px}
  .brand-mark span{display:block;height:3px;border-radius:1px}
  .brand-mark span:nth-child(1){width:22px;background:var(--os-green);margin-left:6px}
  .brand-mark span:nth-child(2){width:28px;background:var(--os-orange)}
  .brand-mark span:nth-child(3){width:24px;background:var(--os-gray);margin-left:3px}
  .brand-mark span:nth-child(4){width:20px;background:var(--os-yellow);margin-left:8px}
  .brand-mark span:nth-child(5){width:26px;background:var(--os-navy);margin-left:1px}
  .brand-name{font-weight:900;font-size:19px;color:var(--os-navy);letter-spacing:-.01em}
  .brand-name em{font-style:normal;font-weight:300;color:var(--os-navy)}
  .brand-divider{width:1px;height:24px;background:var(--os-line)}
  .brand-product{font-size:14px;color:var(--os-ink-2);font-weight:500;letter-spacing:.01em}
  .brand-product b{color:var(--os-ink);font-weight:700}

  .topbar-right{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--os-ink-2)}
  .crumb{display:flex;align-items:center;gap:8px}
  .crumb-dot{width:6px;height:6px;border-radius:50%;background:var(--os-green);box-shadow:0 0 0 3px rgba(156,203,59,.22)}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#002569 0%, #1a4dbf 100%);
    color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}

  /* ─── Main split ─── */
  .main{display:grid;grid-template-columns:480px 1fr;min-height:0}
  .sidebar{background:#fff;border-right:1px solid var(--os-line);display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .stage{position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden}

  /* ─── Sidebar ─── */
  .sb-head{padding:18px 18px 12px}
  .sb-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--os-ink-3);margin:0 0 8px}
  .sb-h1{font-size:19px;font-weight:700;color:var(--os-ink);margin:0 0 10px;line-height:1.25}
  .sb-search{position:relative;margin-bottom:8px}
  .sb-search input{width:100%;padding:10px 10px 10px 34px;border:1px solid var(--os-line);
    border-radius:8px;background:var(--os-bg-2);font-size:14px;outline:none;transition:.15s}
  .sb-search input:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}
  .sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--os-ink-3)}

  .sb-filters{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
  .sb-chip{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--os-bg-3);
    color:var(--os-ink-2);font-weight:600;letter-spacing:.01em;cursor:default;
    border:1px solid transparent;transition:.15s}
  .sb-chip:hover{background:#eef1f5}
  .sb-chip.on{background:#fff;border-color:var(--os-navy);color:var(--os-navy)}

  .sb-list{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
  .sb-list::-webkit-scrollbar{width:8px}
  .sb-list::-webkit-scrollbar-thumb{background:var(--os-line-strong);border-radius:4px}

  .book{margin:2px 0;border-radius:8px;background:transparent}
  .book-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:default}
  .book-row:hover{background:var(--os-bg-3)}
  .book-row.open{background:var(--os-bg-3)}
  .book-spine{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
  .book-meta{flex:1;min-width:0}
  .book-title{font-size:14px;font-weight:700;color:var(--os-ink);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book-sub{font-size:12px;color:var(--os-ink-3);margin-top:1px}
  .book-caret{color:var(--os-ink-3);transition:.18s}
  .book-row.open .book-caret{transform:rotate(90deg);color:var(--os-navy)}
  .book-count{font-size:10px;font-weight:700;color:var(--os-ink-3);
    background:#fff;border:1px solid var(--os-line);border-radius:999px;padding:1px 7px;
    min-width:22px;text-align:center}
  .book-count.has{color:#fff;background:var(--os-orange);border-color:var(--os-orange)}

  .chapters{padding:2px 0 6px 14px;display:flex;flex-direction:column;gap:1px}
  .chap{padding-left:10px;border-left:1px dashed var(--os-line-strong)}
  .chap-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:default}
  .chap-row:hover{background:#fff}
  .chap-num{font-size:10px;font-weight:700;color:var(--os-ink-3);
    background:#fff;border:1px solid var(--os-line);border-radius:4px;padding:2px 5px;
    min-width:22px;text-align:center;font-family:"JetBrains Mono",monospace}
  .chap-name{flex:1;font-size:13.5px;color:var(--os-ink);line-height:1.3}
  .chap-caret{color:var(--os-ink-3);font-size:10px;transition:.15s}
  .chap-row.open .chap-caret{transform:rotate(90deg)}

  .sections{padding:2px 0 6px 12px;display:flex;flex-direction:column}
  .sec-row{display:flex;align-items:flex-start;gap:9px;padding:5px 8px;border-radius:6px;cursor:default;line-height:1.35}
  .sec-row:hover{background:#fff}
  .sec-row.on{background:#fff7ef}
  .sec-check{flex-shrink:0;margin-top:2px;width:14px;height:14px;border-radius:3px;
    border:1.5px solid var(--os-line-strong);background:#fff;display:flex;
    align-items:center;justify-content:center;transition:.12s}
  .sec-row.on .sec-check{background:var(--os-orange);border-color:var(--os-orange)}
  .sec-row.on .sec-check svg{display:block}
  .sec-check svg{display:none}
  .sec-num{font-size:11.5px;color:var(--os-ink-3);font-family:"JetBrains Mono",monospace;flex-shrink:0;margin-top:1px}
  .sec-name{font-size:13.5px;color:var(--os-ink-2);flex:1}
  .sec-row.on .sec-name{color:var(--os-ink);font-weight:600}

  /* ─── Sidebar footer (generate panel) ─── */
  .sb-foot{border-top:1px solid var(--os-line);padding:14px 18px 16px;background:#fff;flex-shrink:0}
  .ctx-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;max-height:78px;overflow-y:auto}
  .ctx-pill{font-size:10.5px;padding:3px 7px 3px 8px;border-radius:999px;
    background:var(--os-orange-tint);color:#a04412;font-weight:600;
    display:inline-flex;align-items:center;gap:5px;line-height:1.3}
  .ctx-pill button{font-size:13px;line-height:1;color:#a04412;opacity:.55;padding:0;display:flex;align-items:center}
  .ctx-pill button:hover{opacity:1}
  .ctx-empty{font-size:12px;color:var(--os-ink-3);font-style:italic;padding:14px 0;text-align:center;
    border:1px dashed var(--os-line-strong);border-radius:8px;margin-bottom:12px}

  .ctx-tag{font-size:11px;color:var(--os-ink-3);margin-bottom:6px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between}
  .ctx-tag span:last-child{color:var(--os-orange);font-weight:700;font-variant-numeric:tabular-nums}

  .gen-row{display:flex;flex-direction:column;gap:8px}
  .gen-label{font-size:11px;color:var(--os-ink-2);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .gen-label em{font-style:normal;color:var(--os-ink-3);font-weight:400}
  .gen-input{width:100%;padding:9px 11px;border:1px solid var(--os-line);border-radius:8px;
    background:var(--os-bg-2);font-size:14px;outline:none;resize:none;min-height:64px;line-height:1.4}
  .gen-input:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 16px;border-radius:8px;font-size:14px;font-weight:700;
    transition:.15s;letter-spacing:.005em;white-space:nowrap}
  .btn-primary{background:var(--os-orange);color:#fff;box-shadow:var(--shadow-sm)}
  .btn-primary:hover{background:#d95e16;box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .btn-primary:disabled{background:#e6e8ec;color:var(--os-ink-3);cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--os-ink-2);border:1px solid var(--os-line)}
  .btn-ghost:hover{background:var(--os-bg-3);color:var(--os-ink)}
  .btn-navy{background:var(--os-navy);color:#fff}
  .btn-navy:hover{background:#001a4d;transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .btn-full{width:100%}
  .btn-sm{padding:6px 10px;font-size:12px;font-weight:600;border-radius:6px}
  .btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ─── Stage / Canvas ─── */
  .stage-bar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;background:#fff;border-bottom:1px solid var(--os-line);z-index:2}
  .stage-bar-l{display:flex;align-items:center;gap:14px}
  .stage-title{font-size:15px;font-weight:700;color:var(--os-ink);margin:0}
  .stage-title em{font-style:normal;color:var(--os-ink-3);font-weight:400;margin-left:6px}
  .stage-status{font-size:11.5px;color:var(--os-ink-2);display:flex;align-items:center;gap:6px;
    padding:3px 9px;background:var(--os-bg-3);border-radius:999px;font-weight:600}
  .stage-status .dot{width:6px;height:6px;border-radius:50%;background:var(--os-ink-3)}
  .stage-status.ready{background:#eef7df;color:#4d6e1d}
  .stage-status.ready .dot{background:var(--os-green);box-shadow:0 0 0 3px rgba(156,203,59,.2)}
  .stage-status.busy{background:#fde7d8;color:#a04412}
  .stage-status.busy .dot{background:var(--os-orange);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .stage-bar-r{display:flex;align-items:center;gap:8px}
  .zoom-ctl{display:flex;align-items:center;background:var(--os-bg-3);border-radius:8px;padding:2px;gap:1px}
  .zoom-ctl button{width:26px;height:26px;border-radius:6px;color:var(--os-ink-2);font-size:14px;font-weight:700}
  .zoom-ctl button:hover{background:#fff}
  .zoom-ctl .zv{font-size:11px;font-weight:600;color:var(--os-ink-2);padding:0 6px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

  .canvas{flex:1;min-height:0;position:relative;overflow:auto;
    background:
      radial-gradient(circle, #d8dde5 1px, transparent 1px) 0 0 / 22px 22px,
      var(--os-bg-2)}
  .canvas-inner{padding:40px 52px 200px;min-width:3200px;transform-origin:top left;transition:transform .2s}

  /* Empty state */
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .empty-card{background:#fff;border:1px dashed var(--os-line-strong);border-radius:14px;
    padding:32px 36px;max-width:480px;text-align:center;pointer-events:auto;box-shadow:var(--shadow-sm)}
  .empty-illust{margin:0 auto 18px;width:88px;height:60px;position:relative}
  .empty-illust div{position:absolute;border-radius:6px;background:#fff;border:1.5px solid var(--os-line-strong)}
  .empty-illust div:nth-child(1){top:8px;left:0;width:42px;height:30px;transform:rotate(-3deg)}
  .empty-illust div:nth-child(2){top:0;left:22px;width:42px;height:34px;background:#fff7ef;border-color:#f5c79b}
  .empty-illust div:nth-child(3){top:14px;left:46px;width:42px;height:30px;transform:rotate(2deg)}
  .empty h2{font-size:17px;color:var(--os-ink);margin:0 0 6px;font-weight:700}
  .empty p{font-size:13px;color:var(--os-ink-2);margin:0;line-height:1.55}

  /* Storyboard rail */
  .rail-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .rail-h1{font-size:22px;font-weight:900;color:var(--os-ink);margin:0;letter-spacing:-.015em}
  .rail-h1 em{font-style:normal;font-weight:400;color:var(--os-ink-3);font-size:14px;margin-left:8px;letter-spacing:0}
  .rail-meta{display:flex;gap:18px;font-size:12px;color:var(--os-ink-2)}
  .rail-meta b{color:var(--os-ink);font-weight:700}

  .ribbon{display:flex;gap:24px;align-items:stretch;padding-bottom:24px}

  .scene{
    flex-shrink:0;width:1000px;background:#fff;border:1px solid var(--os-line);
    border-radius:12px;box-shadow:var(--shadow-md);position:relative;
    transition:.18s;display:flex;flex-direction:column;cursor:default}
  .scene:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--os-line-strong)}
  .scene.selected{border-color:var(--os-orange);box-shadow:0 0 0 3px rgba(243,111,33,.18), var(--shadow-lg);transform:translateY(-2px)}
  .scene.editing{border-color:var(--os-navy);box-shadow:0 0 0 3px rgba(0,37,105,.14), var(--shadow-lg);transform:translateY(-2px)}
  .scene.editing:hover{transform:translateY(-2px)}

  /* inline-edit fields */
  .edit-field{width:100%;border:1px solid var(--os-line);background:var(--os-bg-2);
    border-radius:6px;padding:6px 8px;font-family:inherit;font-size:inherit;line-height:inherit;
    color:inherit;outline:none;resize:none;transition:.12s}
  .edit-field:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}
  .edit-title{font-size:19px;font-weight:700;color:var(--os-ink);line-height:1.3;padding:9px 11px}
  .edit-tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .edit-tag-row select,.edit-tag-row input{padding:6px 10px;font-size:14px;border-radius:5px;
    border:1px solid var(--os-line);background:#fff;font-family:inherit;color:var(--os-ink);outline:none;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase}
  .edit-tag-row input{width:110px;font-family:"JetBrains Mono",monospace;text-transform:none;letter-spacing:0;font-weight:500}
  .edit-actions{display:flex;gap:6px}
  .edit-banner{display:flex;align-items:center;gap:7px;padding:10px 16px;
    background:#eef3ff;color:var(--os-navy);border-bottom:1px solid #d9e2f7;
    font-size:14px;font-weight:700;letter-spacing:.03em}
  .edit-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--os-navy)}
  .scene.flagged::after{content:"";position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--os-orange);border:2px solid #fff;box-shadow:var(--shadow-sm)}
  .scene.regenerating{opacity:.55;pointer-events:none}
  .scene-regen-veil{position:absolute;inset:0;background:rgba(255,255,255,.65);backdrop-filter:blur(1.5px);
    border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:3;
    color:var(--os-orange);font-size:12px;font-weight:700}
  .scene-regen-veil .spin{width:18px;height:18px;border:2.5px solid var(--os-orange);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}

  /* Inline revise popover on a selected scene */
  .revise-pop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
    width:340px;background:#fff;border:1px solid var(--os-line);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:14px;z-index:5}
  .revise-pop::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:12px;height:12px;background:#fff;border-left:1px solid var(--os-line);border-top:1px solid var(--os-line)}
  .revise-pop h4{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--os-ink)}
  .revise-pop p.hint{margin:0 0 10px;font-size:11.5px;color:var(--os-ink-3);line-height:1.45}
  .revise-pop textarea{width:100%;padding:8px 10px;border:1px solid var(--os-line);border-radius:7px;
    background:var(--os-bg-2);font-size:12.5px;outline:none;resize:none;min-height:60px;line-height:1.45;font-family:inherit}
  .revise-pop textarea:focus{border-color:var(--os-orange);background:#fff;box-shadow:0 0 0 3px rgba(243,111,33,.1)}
  .revise-pop .qs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
  .revise-pop .qs button{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--os-bg-3);
    color:var(--os-ink-2);font-weight:600;border:1px solid transparent}
  .revise-pop .qs button:hover{background:#fff;border-color:var(--os-line-strong);color:var(--os-ink)}
  .revise-pop .actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
  .scene-hd{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border-bottom:1px solid var(--os-line);
    background:linear-gradient(180deg,#fff 0%, #fafbfc 100%);border-radius:12px 12px 0 0}
  .scene-num{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--os-ink-3);
    font-family:"JetBrains Mono",monospace}
  .scene-num b{color:var(--os-orange)}
  .scene-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:4px;background:#eef7df;color:#4d6e1d}
  .scene-tag.hook,.scene-tag.narrative{background:#fde7d8;color:#a04412}
  .scene-tag.concept{background:#dbe6ff;color:#1a3a8c}
  .scene-tag.demo{background:#eef7df;color:#4d6e1d}
  .scene-tag.problem,.scene-tag.consequence{background:#fff4d1;color:#8a6b00}
  .scene-tag.recap,.scene-tag.resolution{background:#e8e9ed;color:#3d4452}

  .scene-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:14px}
  .scene-title{font-size:20px;font-weight:700;color:var(--os-ink);margin:0;line-height:1.3}

  .scene-block{font-size:16px;line-height:1.55}
  .scene-block-lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--os-ink-3);margin-bottom:5px;display:flex;align-items:center;gap:5px}

/* Look up the book + chapter for a section ID like "biology2e:09:9.1". */
function lookupSection(id){
  const [bookId, chapN, secN] = id.split(":");
  const book = CATALOG.find(b => b.id === bookId);
  if (!book) return null;
  const chap = book.chapters.find(c => c.n === chapN);
  if (!chap) return null;
  return {book, chap, secN};
}

/* Build the /api/initial_script request from the section the user selected
   first. The backend takes one (book_title, unit_num) at a time; if multiple
   sections are picked we use the first and let chapter/page narrow it. */
function buildGenerateRequest({selected, model, videoType, userQuery}){
  const firstId = Array.from(selected)[0];
  const hit = firstId && lookupSection(firstId);
  if (!hit) return null;
  return {
    book_title: hit.book.bookTitle,
    unit_num: hit.chap.unit,
    chapter_num: parseInt(hit.chap.n, 10),
    page_num: hit.secN,
    user_query: userQuery,
    model_choice: model,
    video_type: videoType,
  };
}

/* ─── Scene card ───
   Backend scene shape:
   { scene_id, type, scene_summary, duration_seconds, setting,
     character_actions, camera:{angle,movement,lens_effect},
     audio:{dialogue:[{character_id,line}], sound_effects, ambience},
     routes_to:{decision_point_id, type} } */
function fmtDuration(secs){
  if (secs == null) return "—";
  const m = Math.floor(secs / 60), s = secs % 60;
  return m > 0 ? `${m}:${String(s).padStart(2,"0")}` : `${s}s`;
}
function characterName(characters, id){
  const c = (characters || []).find(c => c.character_id === id);
  return c ? c.name : id;
}

/* ─── Decision-point card ─── */
function DecisionPointCard({dp, scenes, onChange}){
  const updQ = (v) => onChange({...dp, question_text: v});
  const updChoice = (idx, k, v) => onChange({
    ...dp,
    choices: dp.choices.map((c,i) => i===idx ? {...c, [k]: v} : c)
  });
  const setCorrect = (idx) => onChange({
    ...dp,
    choices: dp.choices.map((c,i) => ({...c, is_correct: i===idx}))
  });
  const moveChoice = (idx, dir) => {
    const newIdx = idx + dir;
    if (newIdx < 0 || newIdx >= (dp.choices||[]).length) return;
    const choices = [...dp.choices];
    [choices[idx], choices[newIdx]] = [choices[newIdx], choices[idx]];
    onChange({...dp, choices});
  };
  return (
    <div className="dp-card">
      <div className="dp-id">DP {dp.decision_point_id} · intro scene {dp.associated_introduction_scene_id ?? "—"}</div>
      <textarea className="dp-q" value={dp.question_text || ""} onChange={e=>updQ(e.target.value)} placeholder="Question prompted to the viewer"/>
      {(dp.choices || []).map((c, i) => (
        <div key={c.choice_id || i} className={`dp-choice ${c.is_correct?"is-correct":""}`}>
          <div className="dp-choice-hd">
            <div className="dp-reorder">
              <button type="button" onClick={()=>moveChoice(i,-1)} disabled={i===0} title="Move up">↑</button>
              <button type="button" onClick={()=>moveChoice(i,1)} disabled={i===(dp.choices.length-1)} title="Move down">↓</button>
            </div>
            <span className="dp-choice-letter">{String.fromCharCode(65+i)}</span>
            <label className={`dp-correct-label ${c.is_correct?"is-correct":""}`}>
              <input type="radio" name={`dp-${dp.decision_point_id}-correct`} checked={!!c.is_correct} onChange={()=>setCorrect(i)}/>
              {c.is_correct ? "✓ Correct" : "Mark correct"}
            </label>
            <select value={c.routes_to_scene ?? ""}
              onChange={e=>updChoice(i, "routes_to_scene", e.target.value === "" ? null : Number(e.target.value))}>
              <option value="">→ scene…</option>
              {(scenes || []).map(s => <option key={s.scene_id} value={s.scene_id}>→ Scene {s.scene_id}</option>)}
            </select>
          </div>
          <textarea value={c.text || ""} onChange={e=>updChoice(i, "text", e.target.value)} placeholder="Choice text"/>
          {!c.is_correct && (
            <textarea value={c.misconception || ""} onChange={e=>updChoice(i, "misconception", e.target.value)} placeholder="Misconception this choice represents (optional)" style={{fontSize:14,minHeight:44}}/>
          )}
        </div>
      ))}
    </div>
  );
}

/* ─── Build tree segments from flat scenes + decision points ─── */
function buildTreeSegments(scenes, decisionPoints) {
  if (!scenes || scenes.length === 0) return [];
  const dps = decisionPoints || [];
  const dpMap = new Map(dps.map(dp => [dp.decision_point_id, dp]));
  const sceneMap = new Map(scenes.map(s => [s.scene_id, s]));

  // Scenes that are direct targets of DP choices are "branch" scenes, not trunk
  const branchSceneIds = new Set(
    dps.flatMap(dp => (dp.choices || []).map(c => c.routes_to_scene).filter(x => x != null))
  );
  const trunk = scenes.filter(s => !branchSceneIds.has(s.scene_id));

  const dpIntroCount = {};
  for (const s of trunk) {
    const id = s.routes_to?.decision_point_id;
    if (id != null) dpIntroCount[id] = (dpIntroCount[id] || 0) + 1;
  }

  const visited = new Set();
  const addedDps = new Set();
  const dpIntroSeen = {};
  const rawSegs = [];

  for (const scene of trunk) {
    if (visited.has(scene.scene_id)) continue;
    rawSegs.push({kind:"scene", scene});
    visited.add(scene.scene_id);

    const dpId = scene.routes_to?.decision_point_id;
    if (dpId != null && !addedDps.has(dpId)) {
      dpIntroSeen[dpId] = (dpIntroSeen[dpId] || 0) + 1;
      if (dpIntroSeen[dpId] >= (dpIntroCount[dpId] || 1)) {
        const dp = dpMap.get(dpId);
        if (dp) {
          addedDps.add(dpId);
          const branches = (dp.choices || []).map(c => ({
            choice: c,
            scene: c.routes_to_scene != null ? sceneMap.get(c.routes_to_scene) : null,
          }));
          branches.forEach(b => { if (b.scene) visited.add(b.scene.scene_id); });
          rawSegs.push({kind:"branch", dp, branches});
        }
      }
    }
  }

  for (const scene of scenes) {
    if (!visited.has(scene.scene_id)) rawSegs.push({kind:"scene", scene});
  }

  // Group consecutive trunk scenes into horizontal rows
  const segments = [];
  let trunkGroup = null;
  for (const seg of rawSegs) {
    if (seg.kind === "scene") {
      if (!trunkGroup) { trunkGroup = {kind:"trunk", scenes:[]}; segments.push(trunkGroup); }
      trunkGroup.scenes.push(seg.scene);
    } else {
      trunkGroup = null;
      segments.push(seg);
    }
  }
  return segments;
}

/* ─── Decision Tree View ─── */
function TreeView({script, density, editingSceneIdx, setEditingSceneIdx, saveSceneEdit, duplicateScene, deleteScene, updateDecisionPoint}){
  const scenes = script.scenes || [];
  const dps = script.decision_points || [];
  const characters = script.characters || [];
  const sceneIdxMap = new Map(scenes.map((s,i) => [s.scene_id, i]));
  const segments = buildTreeSegments(scenes, dps);
  const setCorrectChoice = (dpId, choiceIdx) => {
    const dpIdx = dps.findIndex(d => d.decision_point_id === dpId);
    if (dpIdx < 0 || !updateDecisionPoint) return;
    const dp = dps[dpIdx];
    updateDecisionPoint(dpIdx, {...dp, choices: dp.choices.map((c,i) => ({...c, is_correct: i===choiceIdx}))});
  };

  return (
    <div className="tree-view">
      {segments.map((seg, si) => {
        if (seg.kind === "trunk") {
          return (
            <div key={`trunk-${si}`} className="tree-node">
              {si > 0 && <div className="tree-vline"/>}
              <div className="ribbon" style={{flexWrap:"wrap",justifyContent:"center",paddingBottom:0}}>
                {seg.scenes.map((s, i) => {
                  const idx = sceneIdxMap.get(s.scene_id) ?? -1;
                  return (
                    <Fragment key={s.scene_id ?? i}>
                      {i > 0 && <div className="connector">{I.arrow}</div>}
                      <SceneCard s={s} characters={characters} decisionPoints={dps}
                        density={density}
                        isEditing={editingSceneIdx===idx}
                        onStartEdit={()=>setEditingSceneIdx(idx)}
                        onCancelEdit={()=>setEditingSceneIdx(null)}
                        onSaveEdit={(draft)=>saveSceneEdit(idx, draft)}
                        onDuplicate={()=>duplicateScene(idx)}
                        onDelete={()=>deleteScene(idx)}/>
                    </Fragment>
                  );
                })}
              </div>
            </div>
          );
        }

        if (seg.kind === "branch") {
          return (
            <div key={`dp-${seg.dp.decision_point_id}`} className="tree-branch-frame">
              <div className="tree-vline"/>
              <div className="tree-dp-node">
                <div className="tree-dp-badge">Decision Point {seg.dp.decision_point_id}</div>
                <div className="tree-dp-question">{seg.dp.question_text}</div>
              </div>
              <div className="tree-branch-row">
                {seg.branches.map((b, bi) => {
                  const i = b.scene ? (sceneIdxMap.get(b.scene.scene_id) ?? -1) : -1;
                  return (
                    <div key={b.choice.choice_id ?? bi} className="tree-branch-col">
                      <div className="tree-vline-sm"/>
                      <div
                        className={`choice-pill ${b.choice.is_correct ? "correct-pill" : "wrong-pill"} choice-pill-toggle`}
                        onClick={() => !b.choice.is_correct && setCorrectChoice(seg.dp.decision_point_id, bi)}
                        title={b.choice.is_correct ? "This is the correct answer" : "Click to mark as correct answer"}
                        style={{cursor: b.choice.is_correct ? "default" : "pointer"}}
                      >
                        <span className="choice-letter">
                          {b.choice.is_correct ? "✓ Correct" : "✗ Mark correct"} · {b.choice.choice_id}
                        </span>
                        <span className="choice-text">{b.choice.text}</span>
                      </div>
                      {b.scene ? (
                        <>
                          <div className="tree-vline-sm"/>
                          <SceneCard s={b.scene} characters={characters} decisionPoints={dps}
                            density="compact"
                            isEditing={editingSceneIdx===i}
                            onStartEdit={()=>setEditingSceneIdx(i)}
                            onCancelEdit={()=>setEditingSceneIdx(null)}
                            onSaveEdit={(draft)=>saveSceneEdit(i, draft)}
                            onDuplicate={()=>duplicateScene(i)}
                            onDelete={()=>deleteScene(i)}/>
                          {b.choice.is_correct
                            ? <div className="continues-badge">↓ continues</div>
                            : <div className="retry-badge">↺ returns to decision point</div>}
                        </>
                      ) : (
                        <div style={{fontSize:11,color:"var(--os-ink-3)",fontStyle:"italic",padding:"10px 0"}}>no scene linked</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        return null;
      })}
    </div>
  );
}

/* ─── Export helpers ─── */
function exportJSON(script) {
  const blob = new Blob([JSON.stringify(script, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "scenario_script.json"; a.click();

function exportMarkdown(script) {
  const lines = [];
  lines.push(`# ${script.title || "Untitled Script"}\n`);
  lines.push(`**Scenes:** ${(script.scenes||[]).length} · **Characters:** ${(script.characters||[]).length} · **Decision Points:** ${(script.decision_points||[]).length}\n`);
  if (script.learning_objective) lines.push(`**Learning Objective:** ${script.learning_objective}\n`);
  lines.push("---\n");
  (script.scenes || []).forEach((s, i) => {
    lines.push(`## Scene ${i+1}: ${s.title || s.scene_id}`);
    if (s.setting?.description) lines.push(`\n*Setting:* ${s.setting.description}`);
    if (s.setting?.location) lines.push(`*Location:* ${s.setting.location}`);
    lines.push("");
    (s.audio?.dialogue || []).forEach(dl => {
      lines.push(`**${dl.character_id}:** ${dl.line}`);
    });
    if (s.routes_to?.decision_point_id != null) lines.push(`\n*→ Routes to Decision Point ${s.routes_to.decision_point_id}*`);
    lines.push("\n---\n");
  });
  if ((script.decision_points||[]).length > 0) {
    lines.push("## Decision Points\n");
    (script.decision_points).forEach(dp => {
      lines.push(`### DP ${dp.decision_point_id}: ${dp.question_text}`);
      (dp.choices||[]).forEach(c => {
        lines.push(`- ${c.is_correct?"✓":"✗"} **${c.choice_id}:** ${c.text}`);
      });
      lines.push("");
    });
  }
  const blob = new Blob([lines.join("\n")], {type:"text/markdown"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "scenario_script.md"; a.click();
  URL.revokeObjectURL(url);
}

function exportPDF(script) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  const pageW = 210; const margin = 18; const usableW = pageW - margin * 2;
  let y = margin;

  const checkPage = (needed=10) => {
    if (y + needed > 287) { doc.addPage(); y = margin; }
  };
  const writeLine = (text, size=10, style="normal", color=[30,35,48]) => {
    doc.setFontSize(size); doc.setFont("helvetica", style); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(text, usableW);
    checkPage(lines.length * (size * 0.4 + 1));
    doc.text(lines, margin, y); y += lines.length * (size * 0.4 + 1) + 1;
  };
  const rule = () => { checkPage(4); doc.setDrawColor(200,205,215); doc.line(margin, y, pageW-margin, y); y += 5; };

  // Header
  doc.setFillColor(0, 37, 105);
  doc.rect(0, 0, pageW, 28, "F");
  doc.setFontSize(16); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
  doc.text(script.title || "Untitled Script", margin, 13);
  doc.setFontSize(9); doc.setFont("helvetica","normal"); doc.setTextColor(180,200,240);
  const meta = `${(script.scenes||[]).length} scenes · ${(script.characters||[]).length} characters · ${(script.decision_points||[]).length} decision points`;
  doc.text(meta, margin, 21);
  y = 36;

  if (script.learning_objective) {
    writeLine("Learning Objective", 9, "bold", [100,110,130]);
    writeLine(script.learning_objective, 10, "normal");
    y += 3;
  }

  // Scenes
  (script.scenes || []).forEach((s, i) => {
    rule();
    writeLine(`Scene ${i+1}: ${s.title || s.scene_id}`, 12, "bold", [0,37,105]);
    if (s.setting?.description) writeLine(s.setting.description, 9, "italic", [90,100,115]);
    y += 2;
    (s.audio?.dialogue || []).forEach(dl => {
      checkPage(8);
      doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.setTextColor(80,90,110);
      doc.text(`${dl.character_id}:`, margin, y);
      const nameW = doc.getTextWidth(`${dl.character_id}:`) + 3;
      doc.setFont("helvetica","normal"); doc.setTextColor(30,35,48);
      const spoken = doc.splitTextToSize(dl.line, usableW - nameW);
      doc.text(spoken, margin + nameW, y);
      y += spoken.length * 5 + 1;
    });
    if (s.routes_to?.decision_point_id != null) {
      y += 1; writeLine(`→ Routes to Decision Point ${s.routes_to.decision_point_id}`, 8, "italic", [120,130,150]);
    }
  });

  // Decision Points
  if ((script.decision_points||[]).length > 0) {
    rule();
    writeLine("Decision Points", 13, "bold", [0,37,105]);
    (script.decision_points).forEach(dp => {
      y += 3; checkPage(12);
      writeLine(`DP ${dp.decision_point_id}: ${dp.question_text}`, 10, "bold");
      (dp.choices||[]).forEach(c => {
        writeLine(`  ${c.is_correct?"✓":"○"} ${c.choice_id}: ${c.text}`, 9, c.is_correct?"bold":"normal",
          c.is_correct?[40,120,40]:[60,70,85]);
      });
    });
  }

  doc.save("scenario_script.pdf");
}

function ExportMenu({script}) {
  const [open, setOpen] = React.useState(false);
  const ref = React.useRef(null);
  React.useEffect(() => {
    if (!open) return;
    const handler = (e) => { if (ref.current && !ref.current.contains(e.target)) setOpen(false); };
    document.addEventListener("mousedown", handler);
    return () => document.removeEventListener("mousedown", handler);
  }, [open]);
  return (
    <div className="export-wrap" ref={ref}>
      <button className="btn btn-ghost btn-sm" disabled={!script} onClick={()=>setOpen(o=>!o)}>
        Export ▾
      </button>
      {open && (
        <div className="export-menu">
          <button onClick={()=>{exportJSON(script);setOpen(false);}}>
            <span className="exp-icon">{ }</span> JSON
          </button>
          <button onClick={()=>{exportMarkdown(script);setOpen(false);}}>
            <span className="exp-icon">＃</span> Markdown
          </button>
          <button onClick={()=>{exportPDF(script);setOpen(false);}}>
            <span className="exp-icon">📄</span> PDF
          </button>
        </div>
      )}
    </div>
  );
}

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [selected, setSelected] = useState(new Set(["biology2e:09:9.2"]));
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("All");

  // Generate-panel form state
  const [model, setModel] = useState("anthropic");
  const [videoType, setVideoType] = useState("scenario");
  const [userQuery, setUserQuery] = useState("");
  const [genError, setGenError] = useState(null);

  // Full backend script object: {title, learning_goal, target_audience,
  // total_duration_seconds, visual_style, characters[], scenes[], decision_points[]}
  const [script, setScript] = useState(null);
  const [duplicateUndoStack, setDuplicateUndoStack] = useState([]);
  const [busy, setBusy] = useState(false);
  const [genStep, setGenStep] = useState(0);
  const [zoom, setZoom] = useState(100);
  const [showVideo, setShowVideo] = useState(false);
  const [editingSceneIdx, setEditingSceneIdx] = useState(null);
  const [editingCharacterIdx, setEditingCharacterIdx] = useState(null);

  // Save flow
  const [submitting, setSubmitting] = useState(false);
  const [submitMsg, setSubmitMsg] = useState(null); // {kind:"success"|"error", text}

  const toggleSec = (id) => {
    setSelected(s => {
      const n = new Set(s);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  };
  const removeSec = (id) => setSelected(s => { const n = new Set(s); n.delete(id); return n; });

  // Walk the four-step overlay forward while the LLM call is in flight, then
  // freeze on the last step until the fetch resolves.
  const runGenerate = async () => {
    const req = buildGenerateRequest({selected, model, videoType, userQuery: userQuery.trim()});
    if (!req) {
      setGenError("Pick at least one section from a known textbook.");
      return;
    }
    setGenError(null);
    setSubmitMsg(null);
    setBusy(true);
    setGenStep(0);
    setScript(null);
    setDuplicateUndoStack([]);
    setEditingSceneIdx(null);
    setEditingCharacterIdx(null);

    const stepper = setInterval(() => {
      setGenStep(s => Math.min(s + 1, 3));
    }, 900);

    try {
      const result = await window.OSApi.fetchInitialScript(req);
      clearInterval(stepper);
      setGenStep(4);
      setScript(result);
    } catch (err) {
      clearInterval(stepper);
      setGenError(err.message || "Generation failed");
    } finally {
      setBusy(false);
    }
  };

  const updateScriptField = (k, v) => setScript(curr => curr ? {...curr, [k]: v} : curr);

  const saveSceneEdit = (idx, draft) => {
    setScript(curr => ({
      ...curr,
      scenes: curr.scenes.map((s,i) => i===idx ? draft : s),
    }));
    setEditingSceneIdx(null);
  };
  const duplicateScene = (idx) => {
    setDuplicateUndoStack(s => [...s, script]);
    setScript(curr => {
      const scenes = curr.scenes;
      const copy = {...scenes[idx], scene_id: (scenes[scenes.length-1].scene_id || scenes.length) + 1};
      return {...curr, scenes: [...scenes.slice(0,idx+1), copy, ...scenes.slice(idx+1)]};
    });
  };
  const undoDuplicate = () => {
    if (duplicateUndoStack.length === 0) return;
    setScript(duplicateUndoStack[duplicateUndoStack.length - 1]);
    setDuplicateUndoStack(s => s.slice(0, -1));
  };
  const deleteScene = (idx) => {
    setScript(curr => ({...curr, scenes: curr.scenes.filter((_,i) => i !== idx)}));
    if (editingSceneIdx === idx) setEditingSceneIdx(null);
  };
  const saveCharacterEdit = (idx, draft) => {
    setScript(curr => ({
      ...curr,
      characters: curr.characters.map((c,i) => i===idx ? draft : c),
    }));
    setEditingCharacterIdx(null);
  };
  const updateDecisionPoint = (idx, dp) => {
    setScript(curr => ({
      ...curr,
      decision_points: curr.decision_points.map((d,i) => i===idx ? dp : d),
    }));
  };

  const submitScript = async () => {
    if (!script) return;
    setSubmitting(true);
    setSubmitMsg(null);
    try {
      await window.OSApi.submitModifiedScript(script);
      setSubmitMsg({kind:"success", text:"Saved — backend acknowledged."});
    } catch (err) {
      setSubmitMsg({kind:"error", text: err.message || "Save failed"});
    } finally {
      setSubmitting(false);
    }
  };

  // Apply accent dynamically
  useEffect(() => {
    const root = document.documentElement;
    if (t.accent === "navy"){
      root.style.setProperty("--os-orange", "#002569");
      root.style.setProperty("--os-orange-tint", "#dbe6ff");
    } else if (t.accent === "green"){
      root.style.setProperty("--os-orange", "#7da82e");
      root.style.setProperty("--os-orange-tint", "#eef7df");
    } else {
      root.style.setProperty("--os-orange", "#f36f21");
      root.style.setProperty("--os-orange-tint", "#fde7d8");
    }
  }, [t.accent]);

  const sceneCount = script?.scenes?.length || 0;
  const runtimeLabel = script ? fmtDuration(script.total_duration_seconds) : "—";

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark" aria-hidden>
            <span/><span/><span/><span/><span/>
          </div>
          <div>
            <div className="brand-name">open<em>stax</em></div>
          </div>
          <div className="brand-divider"/>
          <div className="brand-product"><b>Scenario Studio</b> · Internal</div>
        </div>
        <div className="topbar-right">
          <div className="crumb">
            <span className="crumb-dot"/>
            <span>Project · <b style={{color:"var(--os-ink)",fontWeight:600}}>{script?.title || "Untitled scenario"}</b></span>
          </div>
          <div className="avatar">MR</div>
        </div>
      </header>

      <div className="main">
        <div style={{display:"flex",flexDirection:"column",minHeight:0,borderRight:"1px solid var(--os-line)",background:"#fff"}}>
          <Sidebar selected={selected} toggleSec={toggleSec} search={search} setSearch={setSearch} filter={filter} setFilter={setFilter}/>
          <GeneratePanel selected={selected} removeSec={removeSec} onGenerate={runGenerate}
            busy={busy} hasScript={!!script}
            model={model} setModel={setModel}
            videoType={videoType} setVideoType={setVideoType}
            userQuery={userQuery} setUserQuery={setUserQuery}
            genError={genError}/>
        </div>

        <div className="stage">
          <div className="stage-bar">
            <div className="stage-bar-l">
              <h2 className="stage-title">Storyboard canvas <em>{script ? `${sceneCount} scenes · ${runtimeLabel}` : "no script yet"}</em></h2>
              <div className={`stage-status ${busy?"busy":script?"ready":""}`}>
                <span className="dot"/>
                {busy ? "Generating" : script ? "Draft ready" : "Idle"}
              </div>
            </div>
            <div className="stage-bar-r">
              {duplicateUndoStack.length > 0 && (
                <button className="btn btn-ghost btn-sm" onClick={undoDuplicate}
                  title={`Undo last duplicate (${duplicateUndoStack.length} available)`}>
                  ↩ Undo duplicate
                </button>
              )}
              <div className="zoom-ctl">
                <button onClick={()=>setZoom(z=>Math.max(50,z-10))}>−</button>
                <span className="zv">{zoom}%</span>
                <button onClick={()=>setZoom(z=>Math.min(150,z+10))}>+</button>
              </div>
              <ExportMenu script={script}/>
            </div>
          </div>

          <div className="canvas">
            <div className="canvas-inner" style={{transform:`scale(${zoom/100})`}}>
              {script ? (
                <>
                  <div className="overview">
                    <input className="overview-title" value={script.title || ""}
                      onChange={e=>updateScriptField("title", e.target.value)} placeholder="Script title"/>
                    <div className="overview-meta">
                      <span><b>{sceneCount}</b> scenes</span>
                      <span><b>{(script.characters||[]).length}</b> characters</span>
                      <span><b>{(script.decision_points||[]).length}</b> decision points</span>
                      <span><b>{runtimeLabel}</b> est. runtime</span>
                      <span>Grounded in <b>{selected.size}</b> section{selected.size===1?"":"s"}</span>
                    </div>
                    <div className="overview-fields">
                      <div className="overview-field">
                        <label>Learning goal</label>
                        <textarea value={script.learning_goal || ""}
                          onChange={e=>updateScriptField("learning_goal", e.target.value)}/>
                      </div>
                      <div className="overview-field">
                        <label>Target audience</label>
                        <textarea value={script.target_audience || ""}
                          onChange={e=>updateScriptField("target_audience", e.target.value)}/>
                      </div>
                      <div className="overview-field" style={{gridColumn:"1 / -1"}}>
                        <label>Visual style</label>
                        <textarea value={script.visual_style || ""}
                          onChange={e=>updateScriptField("visual_style", e.target.value)}/>
                      </div>
                    </div>
                  </div>

                  <div className="section-hd">
                    <h2>Characters &amp; Setting <em>{(script.characters||[]).length} character{(script.characters||[]).length===1?"":"s"}</em></h2>
                  </div>
                  <div className="strip">
                    <SettingCard
                      setting={script.setting}
                      onChange={(s)=>updateScriptField("setting", s)}/>
                    {(script.characters || []).map((c, i) => (
                      <CharacterCard key={c.character_id || i} c={c}
                        isEditing={editingCharacterIdx===i}
                        onStartEdit={()=>setEditingCharacterIdx(i)}
                        onCancelEdit={()=>setEditingCharacterIdx(null)}
                        onSaveEdit={(draft)=>saveCharacterEdit(i, draft)}/>
                    ))}
                    {(script.characters||[]).length === 0 && (
                      <div style={{padding:14,color:"var(--os-ink-3)",fontSize:14,fontStyle:"italic"}}>No characters defined.</div>
                    )}
                  </div>

                  <div className="section-hd">
                    <h2>Script flow <em>{sceneCount} scene{sceneCount===1?"":"s"}{(script.decision_points||[]).length > 0 ? ` · ${script.decision_points.length} decision point${script.decision_points.length===1?"":"s"}` : ""}</em></h2>
                  </div>
                  <TreeView
                    script={script}
                    density={t.density}
                    editingSceneIdx={editingSceneIdx}
                    setEditingSceneIdx={setEditingSceneIdx}
                    saveSceneEdit={saveSceneEdit}
                    duplicateScene={duplicateScene}
                    deleteScene={deleteScene}
                    updateDecisionPoint={updateDecisionPoint}
                  />

                </>
              ) : !busy && (
                <div className="empty">
                  <div className="empty-card">
                    <div className="empty-illust">
                      <div/><div/><div/>
                    </div>
                    <h2>Your script will appear here as a storyboard</h2>
                    <p>Pick a section in the library on the left, describe the scenario, then hit <b style={{color:"var(--os-orange)"}}>Generate script</b>. The AI grounds the script in the chosen OpenStax content.</p>
                  </div>
                </div>
              )}
            </div>

            {busy && <GenOverlay step={genStep}/>}
          </div>

          {script && !busy && (
            <div className="actionbar">
              <div className="ab-stat">
                <div>
                  <div className="ab-stat-k">Scenes</div>
                  <div className="ab-stat-v">{sceneCount}</div>
                </div>
                <div>
                  <div className="ab-stat-k">Runtime</div>
                  <div className="ab-stat-v">{runtimeLabel}</div>
                </div>
                <div>
                  <div className="ab-stat-k">Sources</div>
                  <div className="ab-stat-v">{selected.size}</div>
                </div>
              </div>
              <div className="ab-actions">
                <button className="btn btn-navy" onClick={submitScript} disabled={submitting}>
                  {submitting ? <><span className="spin"/>Saving…</> : <>{I.edit} Save &amp; continue</>}
                </button>
                <button className="btn btn-ghost" onClick={()=>setShowVideo(true)}>
                  {I.film} Generate scenario video
                </button>
                {submitMsg && (
                  <div className={`save-banner ${submitMsg.kind}`}>{submitMsg.text}</div>
                )}
              </div>
            </div>
          )}
        </div>
      </div>

      {showVideo && <VideoModal onClose={()=>setShowVideo(false)} sceneCount={sceneCount || 0}/>}

      <TweaksPanel>
        <TweakSection label="Canvas density"/>
        <TweakRadio label="Card density" value={t.density} options={["compact","comfy"]}
          onChange={v=>setTweak("density", v)}/>
        <TweakSection label="Accent"/>
        <TweakRadio label="Accent color" value={t.accent} options={["orange","navy","green"]}
          onChange={v=>setTweak("accent", v)}/>
        <TweakSection label="Dev controls"/>
        <TweakButton label={script ? "Reset to empty state" : "Load sample script"}
          onClick={()=> script ? setScript(null) : setScript(SAMPLE_SCRIPT)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
