                )}
                <div className="video-play-circle">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
                </div>
              </>
            )}
          </div>
          <div className="video-hero-foot">
            <div className="video-hero-title">
              {selectedScene ? (selectedScene.narration_text||selectedScene.description||`Scene ${selectedScene.scene_id}`) : (script.title||"Untitled scenario")}
            </div>
            <div className="video-hero-stats">
              <span>{fmtDur(totalSec)} estimated total</span>
              <span className="vdot"/>
              <span>{scenes.length} scene{scenes.length!==1?"s":""}</span>
              <span className="vdot"/>
              <span>{dps.length} decision point{dps.length!==1?"s":""}</span>
            </div>
          </div>
        </div>

        {/* ── Scene clips ── */}
        <section>
          <div className="asset-section-hd">
            <span className="asset-section-title">Scene Clips</span>
            <span className="asset-section-count">{scenes.length} clips</span>
            <div className="asset-section-divider"/>
          </div>

          <div className="video-timeline">
            {trunkScenes.map((scene, i) => {
              const dp = dpByScene[scene.scene_id];
              const branches = dp
                ? dp.choices
                    .filter(c => c.routes_to_scene)
                    .map(c => ({scene: scenes.find(s=>s.scene_id===c.routes_to_scene), choice:c}))
                    .filter(b => b.scene)
                : [];
              return (
                <div key={scene.scene_id} className="video-segment">
                  {i > 0 && <VideoArrowD height={40}/>}
                  <VideoClipCard scene={scene} selected={selectedId===scene.scene_id}
                    onClick={()=>setSelectedId(scene.scene_id)} fmtDur={fmtDur}
                    videoUrl={SCENE_VIDEOS[scene.scene_id]}/>
                  {dp && (
                    <>
                      <VideoArrowD height={40}/>
                      <div className="video-dp-group">
                        <div className="video-dp-label-row">
                          <span className="video-dp-tag">Decision Point {dp.decision_point_id}</span>
                          <span className="video-dp-q">{dp.question_text}</span>
                        </div>
                        <VideoArrowD height={40}/>
                        {branches.length > 0 && (
                          <div className="video-branches-row">
                            {branches.map(({scene:bs,choice})=>{
                              const rt = bs.routes_to;
                              const isRetry = rt?.type === "decision_point";
                              const isContinue = rt?.type === "scene";
                              const routeLabel = isRetry
                                ? `↩ retry · DP ${rt.decision_point_id}`
                                : isContinue ? `→ Scene ${rt.scene_id}` : null;
                              return (
                                <div key={bs.scene_id} className="video-branch-item">
                                  <VideoClipCard scene={bs} choice={choice} branch
                                    selected={selectedId===bs.scene_id}
                                    onClick={()=>setSelectedId(bs.scene_id)} fmtDur={fmtDur}
                                    videoUrl={SCENE_VIDEOS[bs.scene_id]}/>
                                  {rt && <VideoArrowD
                                    label={routeLabel}
                                    colorClass={isRetry?"retry":"continues"}/>}
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    </>
                  )}
                  {!dp && i < trunkScenes.length-1 && <VideoArrowD height={40}/>}
                </div>
              );
            })}
          </div>
        </section>
      </div>
    </div>
  );
}

function App(){
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [selected, setSelected] = useState(new Set(["clinicalnursing:03:3.1"]));
  const [search, setSearch] = useState("");
  const [filter, setFilter] = useState("All");

  // Generate-panel form state
  const [model, setModel] = useState("anthropic");
  const [videoType, setVideoType] = useState("scenario");
  const [userQuery, setUserQuery] = useState("");
  const [genError, setGenError] = useState(null);

  // Full backend script object: {title, learning_goal, target_audience,
  // total_duration_seconds, visual_style, characters[], scenes[], decision_points[]}
  const [script, setScript] = useState(SAMPLE_SCRIPT);
  const [deleteUndoStack, setDeleteUndoStack] = useState([]);
  const [busy, setBusy] = useState(false);
  const [genStep, setGenStep] = useState(0);
  const [zoom, setZoom] = useState(100);
  const [viewMode, setViewMode] = useState("full");
  const [sidebarOpen, setSidebarOpen] = useState(true);
  const [currentPage, setCurrentPage] = useState("script");
  const [editingSceneIdx, setEditingSceneIdx] = useState(null);
  const [editingCharacterIdx, setEditingCharacterIdx] = useState(null);

  // Save flow

  const toggleSec = (id) => {
    setSelected(s => {
      const n = new Set(s);
      n.has(id) ? n.delete(id) : n.add(id);
      return n;
    });
  };
  const removeSec = (id) => setSelected(s => { const n = new Set(s); n.delete(id); return n; });
  const toggleChap = (bookId, chap) => {
    const ids = chap.secs.map(s => `${bookId}:${chap.n}:${s.n}`);
    setSelected(s => {
      const n = new Set(s);
      const allOn = ids.every(id => n.has(id));
      ids.forEach(id => allOn ? n.delete(id) : n.add(id));
      return n;
    });
  };

  // Walk the four-step overlay forward while the LLM call is in flight, then
  // freeze on the last step until the fetch resolves.
  const runGenerate = async () => {
    const req = buildGenerateRequest({selected, model, videoType, userQuery: userQuery.trim()});
    if (!req) {
      setGenError("Pick at least one section from a known textbook.");
      return;
    }
    setGenError(null);
    setBusy(true);
    setGenStep(0);
    setScript(null);
    setDeleteUndoStack([]);
    setEditingSceneIdx(null);
    setEditingCharacterIdx(null);

    const stepper = setInterval(() => {
      setGenStep(s => Math.min(s + 1, 3));
    }, 900);

    try {
      const result = await window.OSApi.fetchInitialScript(req);
      clearInterval(stepper);
      setGenStep(4);
      setScript(result);
    } catch (err) {
      clearInterval(stepper);
      setGenError(err.message || "Generation failed");
    } finally {
      setBusy(false);
    }
  };

  const updateScriptField = (k, v) => setScript(curr => curr ? {...curr, [k]: v} : curr);

  const saveSceneEdit = (idx, draft) => {
    setScript(curr => ({
      ...curr,
      scenes: curr.scenes.map((s,i) => i===idx ? draft : s),
    }));
    setEditingSceneIdx(null);
  };
  const deleteScene = (idx) => {
    setDeleteUndoStack(s => [...s, script]);
    setScript(curr => ({...curr, scenes: curr.scenes.filter((_,i) => i !== idx)}));
    if (editingSceneIdx === idx) setEditingSceneIdx(null);
  };
  const undoDelete = () => {
    if (deleteUndoStack.length === 0) return;
    setScript(deleteUndoStack[deleteUndoStack.length - 1]);
    setDeleteUndoStack(s => s.slice(0, -1));
  };
  const moveScene = (fromIdx, toIdx) => {
    setScript(curr => {
      const scenes = [...curr.scenes];
      [scenes[fromIdx], scenes[toIdx]] = [scenes[toIdx], scenes[fromIdx]];
      return {...curr, scenes};
    });
  };
  const saveCharacterEdit = (idx, draft) => {
    setScript(curr => ({
      ...curr,
      characters: curr.characters.map((c,i) => i===idx ? draft : c),
    }));
    setEditingCharacterIdx(null);
  };
  const updateDecisionPoint = (idx, dp) => {
    setScript(curr => ({
      ...curr,
      decision_points: curr.decision_points.map((d,i) => i===idx ? dp : d),
    }));
  };
  const addDecisionPoint = (sceneIdx) => {
    setScript(curr => {
      const dps = curr.decision_points || [];
      const newId = dps.length > 0 ? Math.max(...dps.map(d => d.decision_point_id)) + 1 : 1;
      const scene = curr.scenes[sceneIdx];
      const newDP = {
        decision_point_id: newId,
        question_text: "What should the nurse do next?",
        associated_introduction_scene_id: scene.scene_id,
        choices: [
          {choice_id:"A", text:"Choice A", is_correct:true,  routes_to_scene:null, misconception:""},
          {choice_id:"B", text:"Choice B", is_correct:false, routes_to_scene:null, misconception:""},
          {choice_id:"C", text:"Choice C", is_correct:false, routes_to_scene:null, misconception:""},
        ],
      };
      const updatedScenes = curr.scenes.map((s,i) =>
        i===sceneIdx ? {...s, routes_to:{...( s.routes_to||{}), decision_point_id:newId, type:"true_choice"}} : s
      );
      return {...curr, scenes:updatedScenes, decision_points:[...dps, newDP]};
    });
  };


  // Apply accent dynamically
  useEffect(() => {
    const root = document.documentElement;
    if (t.accent === "navy"){
      root.style.setProperty("--os-orange", "#002569");
      root.style.setProperty("--os-orange-tint", "#dbe6ff");
    } else if (t.accent === "green"){
      root.style.setProperty("--os-orange", "#7da82e");
      root.style.setProperty("--os-orange-tint", "#eef7df");
    } else {
      root.style.setProperty("--os-orange", "#f36f21");
      root.style.setProperty("--os-orange-tint", "#fde7d8");
    }
  }, [t.accent]);

  const sceneCount = script?.scenes?.length || 0;
  const runtimeLabel = script ? fmtDuration(script.total_duration_seconds) : "—";

  return (
    <div className="app">
      <header className="topbar">
        <div className="brand">
          <div className="brand-mark" aria-hidden>
            <span/><span/><span/><span/><span/>
          </div>
          <div>
            <div className="brand-name">open<em>stax</em></div>
          </div>
          <div className="brand-divider"/>
          <div className="brand-product"><b>Scenario Studio</b> · Internal</div>
        </div>
        <div className="topbar-right">
          <div className="crumb">
            <span className="crumb-dot"/>
            <span>Project · <b style={{color:"var(--os-ink)",fontWeight:600}}>{script?.title || "Untitled scenario"}</b></span>
          </div>
          <div className="avatar">MR</div>
        </div>
      </header>

      {currentPage==="assets" && script
        ? <AssetsPage script={script} onBack={()=>setCurrentPage("script")} onViewVideos={()=>setCurrentPage("videos")}/>
        : null}
      {currentPage==="videos" && script
        ? <VideoPage script={script} onBack={()=>setCurrentPage(videoType === "manim" ? "script" : "assets")}/>
        : null}
      <div className={`main${sidebarOpen?"":" sidebar-collapsed"}`} style={{display:(currentPage==="assets"||currentPage==="videos")?"none":"grid"}}>
        <div className="sidebar-wrap">
          <Sidebar selected={selected} toggleSec={toggleSec} toggleChap={toggleChap} search={search} setSearch={setSearch} filter={filter} setFilter={setFilter}/>
          <GeneratePanel selected={selected} removeSec={removeSec} onGenerate={runGenerate}
            busy={busy} hasScript={!!script}
            model={model} setModel={setModel}
            videoType={videoType} setVideoType={setVideoType}
            userQuery={userQuery} setUserQuery={setUserQuery}
            genError={genError}/>
        </div>

        <div className="stage">
          <div className="stage-bar">
            <div className="stage-bar-l">
              <button className="sidebar-toggle" onClick={()=>setSidebarOpen(o=>!o)}
                title={sidebarOpen?"Collapse sidebar":"Expand sidebar"}>
                {sidebarOpen ? "‹" : "›"}
              </button>
              <h2 className="stage-title">Storyboard canvas <em>{script ? `${sceneCount} scenes · ${runtimeLabel}` : "no script yet"}</em></h2>
              <div className={`stage-status ${busy?"busy":script?"ready":""}`}>
                <span className="dot"/>
                {busy ? "Generating" : script ? "Draft ready" : "Idle"}
              </div>
            </div>
            <div className="stage-bar-r">
              {deleteUndoStack.length > 0 && (
                <button className="btn btn-ghost btn-sm" onClick={undoDelete}
                  title={`Undo last delete (${deleteUndoStack.length} available)`}>
                  ↩ Undo delete
                </button>
              )}
              <div className="view-mode-ctl">
                <span className="view-mode-lbl">View:</span>
                <select className="view-mode-select" value={viewMode} onChange={e=>setViewMode(e.target.value)}>
                  <option value="full">Full script</option>
                  <option value="dialogue">Dialogue</option>
                  <option value="action">Action</option>
                  <option value="camera">Camera</option>
                </select>
              </div>
              <div className="zoom-ctl">
                <button onClick={()=>setZoom(z=>Math.max(50,z-10))}>−</button>
                <span className="zv">{zoom}%</span>
                <button onClick={()=>setZoom(z=>Math.min(150,z+10))}>+</button>
              </div>
              <ExportMenu script={script}/>
            </div>
          </div>

          {script && (
            <div className="assets-next-strip">
              <div className="assets-next-strip-l">
                <span className="assets-next-step-label">Next step</span>
                <span className="assets-next-step-desc">
                  {videoType === "manim"
                    ? "Script is ready — preview the generated Manim animations"
                    : "Script is ready — review and customize the video assets"}
                </span>
              </div>
              <button className="btn-assets" onClick={()=>setCurrentPage(videoType === "manim" ? "videos" : "assets")}>
                {videoType === "manim" ? "View Videos" : "View Assets"} {I.arrowRight}
              </button>
            </div>
          )}

          <div className="canvas">
            {!script && !busy && (
              <div className="empty">
                <div className="empty-card">
                  <div className="empty-illust">
                    <div/><div/><div/>
                  </div>
                  <h2>Your script will appear here as a storyboard</h2>
                  <p>Pick a section in the library on the left, describe the scenario, then hit <b style={{color:"var(--os-orange)"}}>Generate script</b>. The AI grounds the script in the chosen OpenStax content.</p>
                </div>
              </div>
            )}
            <div className="canvas-inner" style={{transform:`scale(${zoom/100})`}}>
              {script ? (
                <>
                  <div className="overview">
                    <input className="overview-title" value={script.title || ""}
                      onChange={e=>updateScriptField("title", e.target.value)} placeholder="Script title"/>
                    <div className="overview-meta">
                      <span><b>{sceneCount}</b> scenes</span>
                      <span><b>{(script.characters||[]).length}</b> characters</span>
                      <span><b>{(script.decision_points||[]).length}</b> decision points</span>
                      <span><b>{runtimeLabel}</b> est. runtime</span>
                      <span>Grounded in <b>{selected.size}</b> section{selected.size===1?"":"s"}</span>
                    </div>
                    <div className="overview-fields">
                      <div className="overview-field">
                        <label>Learning goal</label>
                        <textarea value={script.learning_goal || ""}
                          onChange={e=>updateScriptField("learning_goal", e.target.value)}/>
                      </div>
                      <div className="overview-field">
                        <label>Target audience</label>
                        <textarea value={script.target_audience || ""}
                          onChange={e=>updateScriptField("target_audience", e.target.value)}/>
                      </div>
                      <div className="overview-field" style={{gridColumn:"1 / -1"}}>
                        <label>Visual style</label>
                        <textarea value={script.visual_style || ""}
                          onChange={e=>updateScriptField("visual_style", e.target.value)}/>
                      </div>
                    </div>
                  </div>

                  <div className="section-hd">
                    <h2>Characters &amp; Setting <em>{(script.characters||[]).length} character{(script.characters||[]).length===1?"":"s"}</em></h2>
                  </div>
                  <div className="strip">
                    <SettingCard
                      setting={script.setting}
                      onChange={(s)=>updateScriptField("setting", s)}/>
                    {(script.characters || []).map((c, i) => (
                      <CharacterCard key={c.character_id || i} c={c}
                        isEditing={editingCharacterIdx===i}
                        onStartEdit={()=>setEditingCharacterIdx(i)}
                        onCancelEdit={()=>setEditingCharacterIdx(null)}
                        onSaveEdit={(draft)=>saveCharacterEdit(i, draft)}/>
                    ))}
                    {(script.characters||[]).length === 0 && (
                      <div style={{padding:14,color:"var(--os-ink-3)",fontSize:14,fontStyle:"italic"}}>No characters defined.</div>
                    )}
                  </div>

                  <div className="section-hd">
                    <h2>Script flow <em>{sceneCount} scene{sceneCount===1?"":"s"}{(script.decision_points||[]).length > 0 ? ` · ${script.decision_points.length} decision point${script.decision_points.length===1?"":"s"}` : ""}</em></h2>
                  </div>
                  <TreeView
                    script={script}
                    density={t.density}
                    viewMode={viewMode}
                    editingSceneIdx={editingSceneIdx}
                    setEditingSceneIdx={setEditingSceneIdx}
                    saveSceneEdit={saveSceneEdit}
                    deleteScene={deleteScene}
                    moveScene={moveScene}
                    updateDecisionPoint={updateDecisionPoint}
                    addDecisionPoint={addDecisionPoint}
                  />

                </>
              ) : null}
            </div>

            {busy && <GenOverlay step={genStep}/>}
          </div>

        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Canvas density"/>
        <TweakRadio label="Card density" value={t.density} options={["compact","comfy"]}
          onChange={v=>setTweak("density", v)}/>
        <TweakSection label="Accent"/>
        <TweakRadio label="Accent color" value={t.accent} options={["orange","navy","green"]}
          onChange={v=>setTweak("accent", v)}/>
        <TweakSection label="Dev controls"/>
        <TweakButton label={script ? "Reset to empty state" : "Load sample script"}
          onClick={()=> script ? setScript(null) : setScript(SAMPLE_SCRIPT)}/>
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
