<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OpenStax · Scenario Script Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>

<style>
  :root{
    --os-navy:#002569;
    --os-navy-ink:#0b1a3d;
    --os-orange:#f36f21;
    --os-orange-tint:#fde7d8;
    --os-green:#9ccb3b;
    --os-yellow:#f4c61f;
    --os-gray:#5e6a71;
    --os-line:#e6e8ec;
    --os-line-strong:#cdd2d9;
    --os-bg:#ffffff;
    --os-bg-2:#fafbfc;
    --os-bg-3:#f3f5f8;
    --os-ink:#1d2330;
    --os-ink-2:#4a525f;
    --os-ink-3:#7a828f;
    --shadow-sm:0 1px 2px rgba(15,23,42,.04), 0 1px 1px rgba(15,23,42,.03);
    --shadow-md:0 4px 14px rgba(15,23,42,.06), 0 1px 3px rgba(15,23,42,.04);
    --shadow-lg:0 18px 48px -16px rgba(15,23,42,.18), 0 6px 16px rgba(15,23,42,.06);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--os-bg-2);color:var(--os-ink);font-family:"Lato",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  body{min-height:100vh;overflow:hidden}
  button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
  input,textarea{font-family:inherit;color:inherit}
  .mono{font-family:"JetBrains Mono",ui-monospace,monospace}

  /* ─── App shell ─── */
  .app{display:grid;grid-template-rows:60px 1fr;height:100vh}
  .topbar{display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;background:#fff;border-bottom:1px solid var(--os-line);z-index:5}
  .brand{display:flex;align-items:center;gap:14px}
  .brand-mark{display:flex;flex-direction:column;gap:3px}
  .brand-mark span{display:block;height:3px;border-radius:1px}
  .brand-mark span:nth-child(1){width:22px;background:var(--os-green);margin-left:6px}
  .brand-mark span:nth-child(2){width:28px;background:var(--os-orange)}
  .brand-mark span:nth-child(3){width:24px;background:var(--os-gray);margin-left:3px}
  .brand-mark span:nth-child(4){width:20px;background:var(--os-yellow);margin-left:8px}
  .brand-mark span:nth-child(5){width:26px;background:var(--os-navy);margin-left:1px}
  .brand-name{font-weight:900;font-size:19px;color:var(--os-navy);letter-spacing:-.01em}
  .brand-name em{font-style:normal;font-weight:300;color:var(--os-navy)}
  .brand-divider{width:1px;height:24px;background:var(--os-line)}
  .brand-product{font-size:14px;color:var(--os-ink-2);font-weight:500;letter-spacing:.01em}
  .brand-product b{color:var(--os-ink);font-weight:700}

  .topbar-right{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--os-ink-2)}
  .crumb{display:flex;align-items:center;gap:8px}
  .crumb-dot{width:6px;height:6px;border-radius:50%;background:var(--os-green);box-shadow:0 0 0 3px rgba(156,203,59,.22)}
  .avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#002569 0%, #1a4dbf 100%);
    color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;letter-spacing:.02em}

  /* ─── Main split ─── */
  .main{display:grid;grid-template-columns:360px 1fr;min-height:0;transition:grid-template-columns .22s ease}
  .main.sidebar-collapsed{grid-template-columns:0px 1fr}
  .sidebar-wrap{display:flex;flex-direction:column;min-height:0;overflow:hidden;border-right:1px solid var(--os-line);background:#fff}
  .main.sidebar-collapsed .sidebar-wrap{border-right:none}
  .sidebar{background:#fff;display:flex;flex-direction:column;min-height:0;overflow:hidden}
  .stage{position:relative;min-height:0;display:flex;flex-direction:column;overflow:hidden}
  .sidebar-toggle{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px;border:1px solid var(--os-line);background:#fff;cursor:pointer;font-size:11px;color:var(--os-ink-2);flex-shrink:0}
  .sidebar-toggle:hover{background:var(--os-bg-3);color:var(--os-ink)}

  /* ─── Sidebar ─── */
  .sb-head{padding:18px 18px 12px}
  .sb-title{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--os-ink-3);margin:0 0 8px}
  .sb-h1{font-size:19px;font-weight:700;color:var(--os-ink);margin:0 0 10px;line-height:1.25}
  .sb-search{position:relative;margin-bottom:8px}
  .sb-search input{width:100%;padding:10px 10px 10px 34px;border:1px solid var(--os-line);
    border-radius:8px;background:var(--os-bg-2);font-size:14px;outline:none;transition:.15s}
  .sb-search input:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}
  .sb-search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--os-ink-3)}

  .sb-filters{display:flex;gap:6px;padding:0 18px 12px;flex-wrap:wrap}
  .sb-chip{font-size:11px;padding:4px 9px;border-radius:999px;background:var(--os-bg-3);
    color:var(--os-ink-2);font-weight:600;letter-spacing:.01em;cursor:default;
    border:1px solid transparent;transition:.15s}
  .sb-chip:hover{background:#eef1f5}
  .sb-chip.on{background:#fff;border-color:var(--os-navy);color:var(--os-navy)}

  .sb-list{flex:1;overflow-y:auto;padding:4px 8px 12px;min-height:0}
  .sb-list::-webkit-scrollbar{width:8px}
  .sb-list::-webkit-scrollbar-thumb{background:var(--os-line-strong);border-radius:4px}

  .book{margin:2px 0;border-radius:8px;background:transparent}
  .book-row{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:8px;cursor:default}
  .book-row:hover{background:var(--os-bg-3)}
  .book-row.open{background:var(--os-bg-3)}
  .book-spine{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
  .book-meta{flex:1;min-width:0}
  .book-title{font-size:14px;font-weight:700;color:var(--os-ink);line-height:1.25;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .book-sub{font-size:12px;color:var(--os-ink-3);margin-top:1px}
  .book-caret{color:var(--os-ink-3);transition:.18s}
  .book-row.open .book-caret{transform:rotate(90deg);color:var(--os-navy)}
  .book-count{font-size:10px;font-weight:700;color:var(--os-ink-3);
    background:#fff;border:1px solid var(--os-line);border-radius:999px;padding:1px 7px;
    min-width:22px;text-align:center}
  .book-count.has{color:#fff;background:var(--os-orange);border-color:var(--os-orange)}

  .chapters{padding:2px 0 6px 14px;display:flex;flex-direction:column;gap:1px}
  .chap{padding-left:10px;border-left:1px dashed var(--os-line-strong)}
  .chap-row{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;cursor:default}
  .chap-row:hover{background:#fff}
  .chap-sel{width:14px;height:14px;border-radius:3px;border:1.5px solid var(--os-line-strong);background:#fff;flex-shrink:0;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.12s}
  .chap-sel:hover{border-color:var(--os-navy)}
  .chap-sel.all{background:var(--os-navy);border-color:var(--os-navy)}
  .chap-sel.some{background:var(--os-navy);border-color:var(--os-navy);opacity:.45}
  .chap-sel svg{display:block}
  .chap-num{font-size:10px;font-weight:700;color:var(--os-ink-3);
    background:#fff;border:1px solid var(--os-line);border-radius:4px;padding:2px 5px;
    min-width:22px;text-align:center;font-family:"JetBrains Mono",monospace}
  .chap-name{flex:1;font-size:13.5px;color:var(--os-ink);line-height:1.3}
  .chap-caret{color:var(--os-ink-3);font-size:10px;transition:.15s}
  .chap-row.open .chap-caret{transform:rotate(90deg)}

  .sections{padding:2px 0 6px 12px;display:flex;flex-direction:column}
  .sec-row{display:flex;align-items:flex-start;gap:9px;padding:5px 8px;border-radius:6px;cursor:default;line-height:1.35}
  .sec-row:hover{background:#fff}
  .sec-row.on{background:#fff7ef}
  .sec-check{flex-shrink:0;margin-top:2px;width:14px;height:14px;border-radius:3px;
    border:1.5px solid var(--os-line-strong);background:#fff;display:flex;
    align-items:center;justify-content:center;transition:.12s}
  .sec-row.on .sec-check{background:var(--os-orange);border-color:var(--os-orange)}
  .sec-row.on .sec-check svg{display:block}
  .sec-check svg{display:none}
  .sec-num{font-size:11.5px;color:var(--os-ink-3);font-family:"JetBrains Mono",monospace;flex-shrink:0;margin-top:1px}
  .sec-name{font-size:13.5px;color:var(--os-ink-2);flex:1}
  .sec-row.on .sec-name{color:var(--os-ink);font-weight:600}

  /* ─── Sidebar footer (generate panel) ─── */
  .sb-foot{border-top:1px solid var(--os-line);padding:14px 18px 16px;background:#fff;flex-shrink:0}
  .ctx-pills{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;max-height:78px;overflow-y:auto}
  .ctx-pill{font-size:10.5px;padding:3px 7px 3px 8px;border-radius:999px;
    background:var(--os-orange-tint);color:#a04412;font-weight:600;
    display:inline-flex;align-items:center;gap:5px;line-height:1.3}
  .ctx-pill button{font-size:13px;line-height:1;color:#a04412;opacity:.55;padding:0;display:flex;align-items:center}
  .ctx-pill button:hover{opacity:1}
  .ctx-empty{font-size:12px;color:var(--os-ink-3);font-style:italic;padding:14px 0;text-align:center;
    border:1px dashed var(--os-line-strong);border-radius:8px;margin-bottom:12px}

  .ctx-tag{font-size:11px;color:var(--os-ink-3);margin-bottom:6px;font-weight:600;
    letter-spacing:.04em;text-transform:uppercase;display:flex;justify-content:space-between}
  .ctx-tag span:last-child{color:var(--os-orange);font-weight:700;font-variant-numeric:tabular-nums}

  .gen-row{display:flex;flex-direction:column;gap:8px}
  .gen-label{font-size:11px;color:var(--os-ink-2);font-weight:600;display:flex;justify-content:space-between;align-items:baseline}
  .gen-label em{font-style:normal;color:var(--os-ink-3);font-weight:400}
  .gen-input{width:100%;padding:9px 11px;border:1px solid var(--os-line);border-radius:8px;
    background:var(--os-bg-2);font-size:14px;outline:none;resize:none;min-height:64px;line-height:1.4}
  .gen-input:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 16px;border-radius:8px;font-size:14px;font-weight:700;
    transition:.15s;letter-spacing:.005em;white-space:nowrap}
  .btn-primary{background:var(--os-orange);color:#fff;box-shadow:var(--shadow-sm)}
  .btn-primary:hover{background:#d95e16;box-shadow:var(--shadow-md);transform:translateY(-1px)}
  .btn-primary:disabled{background:#e6e8ec;color:var(--os-ink-3);cursor:not-allowed;transform:none;box-shadow:none}
  .btn-ghost{background:transparent;color:var(--os-ink-2);border:1px solid var(--os-line)}
  .btn-ghost:hover{background:var(--os-bg-3);color:var(--os-ink)}
  .btn-navy{background:var(--os-navy);color:#fff}
  .btn-navy:hover{background:#001a4d;transform:translateY(-1px);box-shadow:var(--shadow-md)}
  .btn-full{width:100%}
  .btn-sm{padding:6px 10px;font-size:12px;font-weight:600;border-radius:6px}
  .btn .spin{width:13px;height:13px;border:2px solid currentColor;border-right-color:transparent;
    border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ─── Stage / Canvas ─── */
  .stage-bar{display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;background:#fff;border-bottom:1px solid var(--os-line);z-index:2}
  .stage-bar-l{display:flex;align-items:center;gap:14px}
  .stage-title{font-size:15px;font-weight:700;color:var(--os-ink);margin:0}
  .stage-title em{font-style:normal;color:var(--os-ink-3);font-weight:400;margin-left:6px}
  .stage-status{font-size:11.5px;color:var(--os-ink-2);display:flex;align-items:center;gap:6px;
    padding:3px 9px;background:var(--os-bg-3);border-radius:999px;font-weight:600}
  .stage-status .dot{width:6px;height:6px;border-radius:50%;background:var(--os-ink-3)}
  .stage-status.ready{background:#eef7df;color:#4d6e1d}
  .stage-status.ready .dot{background:var(--os-green);box-shadow:0 0 0 3px rgba(156,203,59,.2)}
  .stage-status.busy{background:#fde7d8;color:#a04412}
  .stage-status.busy .dot{background:var(--os-orange);animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

  .stage-bar-r{display:flex;align-items:center;gap:8px}
  .view-mode-ctl{display:flex;align-items:center;gap:6px}
  .view-mode-lbl{font-size:12px;font-weight:600;color:var(--os-ink-3);letter-spacing:.04em;text-transform:uppercase}
  .view-mode-select{padding:4px 8px;border-radius:7px;border:1.5px solid var(--os-line);background:var(--os-bg-1);font-size:13px;font-weight:500;color:var(--os-ink-1);cursor:pointer;outline:none}
  .view-mode-select:focus{border-color:var(--os-navy)}
  .scene-focused-view{display:flex;flex-direction:column;gap:10px;padding:4px 0}
  .scene-focused-line{font-size:18px;line-height:1.55;margin:0;color:var(--os-ink-1)}
  .scene-focused-speaker{font-weight:700;color:var(--os-navy);margin-right:8px;font-style:normal}
  .scene-focused-empty{font-size:15px;color:var(--os-ink-3);font-style:italic;margin:0}
  .zoom-ctl{display:flex;align-items:center;background:var(--os-bg-3);border-radius:8px;padding:2px;gap:1px}
  .zoom-ctl button{width:26px;height:26px;border-radius:6px;color:var(--os-ink-2);font-size:14px;font-weight:700}
  .zoom-ctl button:hover{background:#fff}
  .zoom-ctl .zv{font-size:11px;font-weight:600;color:var(--os-ink-2);padding:0 6px;min-width:44px;text-align:center;font-variant-numeric:tabular-nums}

  .canvas{flex:1;min-height:0;position:relative;overflow:auto;
    background:
      radial-gradient(circle, #d8dde5 1px, transparent 1px) 0 0 / 22px 22px,
      var(--os-bg-2)}
  .canvas-inner{padding:40px 52px 200px;min-width:3200px;transform-origin:top left;transition:transform .2s}

  /* ─── Assets page ─── */
  .assets-page{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;background:var(--os-bg-2)}
  .assets-topbar{display:flex;align-items:center;gap:16px;padding:14px 32px;
    background:#fff;border-bottom:1px solid var(--os-line);position:sticky;top:0;z-index:10}
  .assets-back{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;
    color:var(--os-ink-2);background:var(--os-bg-3);border:1px solid var(--os-line);
    border-radius:8px;padding:6px 12px;cursor:pointer;transition:.12s}
  .assets-back:hover{background:var(--os-line);color:var(--os-ink)}
  .assets-topbar-title{flex:1;text-align:center}
  .assets-topbar-title h2{font-size:16px;font-weight:800;color:var(--os-navy);margin:0;letter-spacing:-.01em}
  .assets-topbar-title p{font-size:12px;color:var(--os-ink-3);margin:2px 0 0;font-style:italic}
  .assets-body{padding:40px 52px 80px;display:flex;flex-direction:column;gap:48px}
  .asset-section-hd{display:flex;align-items:baseline;gap:12px;margin-bottom:20px}
  .asset-section-title{font-size:11px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;
    color:var(--os-navy);font-family:"JetBrains Mono",monospace}
  .asset-section-count{font-size:11px;color:var(--os-ink-3);font-weight:500}
  .asset-section-divider{flex:1;height:1px;background:var(--os-line);margin-left:8px}
  .asset-grid{display:flex;flex-wrap:wrap;gap:20px}
  .asset-card{background:#fff;border:1.5px solid var(--os-line);border-radius:14px;
    overflow:hidden;width:220px;display:flex;flex-direction:column;
    box-shadow:0 1px 4px rgba(0,0,0,.06);transition:.15s}
  .asset-card:hover{border-color:var(--os-navy);box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .asset-img-wrap{width:100%;height:160px;overflow:hidden;position:relative;background:#eef0f5;cursor:zoom-in}
  .asset-img-wrap img{width:100%;height:100%;object-fit:cover}
  .asset-lightbox{position:fixed;inset:0;z-index:1000;background:rgba(0,0,0,.82);
    display:flex;align-items:center;justify-content:center;cursor:zoom-out}
  .asset-lightbox img{max-width:88vw;max-height:88vh;object-fit:contain;border-radius:10px;
    box-shadow:0 24px 80px rgba(0,0,0,.6)}
  .asset-lightbox-label{position:fixed;bottom:32px;left:50%;transform:translateX(-50%);
    font-size:14px;font-weight:600;color:rgba(255,255,255,.7);letter-spacing:.04em;pointer-events:none}
  .asset-img-placeholder{width:100%;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:10px;
    background:linear-gradient(145deg,#eef0f5,#e4e7ef)}
  .asset-img-placeholder svg{color:#b0b8cc;opacity:.8}
  .asset-cat-badge{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    font-family:"JetBrains Mono",monospace;color:#8892a8;margin-top:4px}
  .asset-card-info{padding:12px 14px 8px;border-bottom:1px solid var(--os-line)}
  .asset-card-name{font-size:14px;font-weight:700;color:var(--os-ink)}
  .asset-card-role{font-size:11.5px;color:var(--os-ink-3);margin-top:2px}
  .asset-card-form{padding:10px 14px 14px;display:flex;flex-direction:column;gap:8px;flex:1}
  .asset-request-ta{width:100%;padding:7px 9px;border:1.5px solid var(--os-line);border-radius:8px;
    font-size:12px;font-family:inherit;resize:none;outline:none;background:#fafbfc;
    color:var(--os-ink);transition:.12s;box-sizing:border-box}
  .asset-request-ta:focus{border-color:var(--os-navy);background:#fff}
  .asset-request-btn{align-self:flex-end;font-size:12px;font-weight:700;padding:5px 14px;
    border-radius:7px;cursor:pointer;background:var(--os-navy);color:#fff;
    border:none;transition:.12s;letter-spacing:.02em}
  .asset-request-btn:hover:not(:disabled){background:#001a4d;transform:translateY(-1px)}
  .asset-request-btn:disabled{opacity:.35;cursor:not-allowed}
  .asset-requested{display:flex;flex-direction:column;gap:6px}
  .asset-requested-badge{display:flex;align-items:center;gap:6px;font-size:12px;
    font-weight:700;color:#4d6e1d}
  .asset-requested-text{font-size:11.5px;color:var(--os-ink-2);font-style:italic;
    background:#f4f7ee;border:1px solid #c8e08a;border-radius:6px;padding:5px 8px;line-height:1.4}
  .asset-edit-link{font-size:11px;color:var(--os-ink-3);cursor:pointer;text-decoration:underline;
    align-self:flex-start;background:none;border:none;padding:0}
  .assets-next-strip{display:flex;align-items:center;justify-content:space-between;
    padding:12px 24px;background:linear-gradient(90deg,#001a4d,#0a2d6e);
    border-bottom:1px solid #001233;gap:16px}
  .assets-next-strip-l{display:flex;align-items:center;gap:10px}
  .assets-next-step-label{font-size:11px;font-weight:700;letter-spacing:.1em;
    text-transform:uppercase;color:rgba(255,255,255,.55);font-family:"JetBrains Mono",monospace}
  .assets-next-step-desc{font-size:13px;font-weight:600;color:#fff}
  .btn-assets{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:800;
    padding:10px 22px;border-radius:10px;cursor:pointer;
    background:var(--os-orange);color:#fff;
    border:none;letter-spacing:.02em;white-space:nowrap;
    box-shadow:0 0 0 0 rgba(235,128,41,.5);
    animation:assets-pulse 2s ease-in-out infinite}
  .btn-assets:hover{background:#d4671a;transform:translateY(-1px);
    box-shadow:0 4px 20px rgba(235,128,41,.5);animation:none}
  @keyframes assets-pulse{
    0%,100%{box-shadow:0 0 0 0 rgba(235,128,41,.45)}
    50%{box-shadow:0 0 0 8px rgba(235,128,41,0)}
  }

  /* ─── Video Page ─── */
  .video-page{display:flex;flex-direction:column;flex:1;min-height:0;overflow:auto;background:var(--os-bg-2);align-items:center}
  .video-body{padding:40px 52px 80px;display:flex;flex-direction:column;gap:48px;width:100%;max-width:1000px}
  .video-hero{background:#fff;border:1.5px solid var(--os-line);border-radius:16px;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.06)}
  .video-player-lg{background:#0d1117;aspect-ratio:16/9;display:flex;flex-direction:column;
    align-items:center;justify-content:center;position:relative;cursor:pointer;overflow:hidden}
  .video-player-video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;cursor:default}
  .video-clip-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
  .video-player-lg:hover .video-play-circle{background:rgba(255,255,255,.2);border-color:rgba(255,255,255,.55)}
  .video-play-circle{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.12);
    border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;
    color:#fff;transition:.2s;padding-left:4px}
  .video-scene-label-overlay{position:absolute;top:14px;left:18px;font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45);
    font-family:"JetBrains Mono",monospace}
  .video-combined-label{position:absolute;bottom:14px;left:18px;font-size:10px;font-weight:700;
    letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);
    font-family:"JetBrains Mono",monospace}
  .video-hero-foot{padding:18px 24px;border-top:1px solid var(--os-line)}
  .video-hero-title{font-size:16px;font-weight:800;color:var(--os-navy);margin:0}
  .video-hero-stats{display:flex;gap:10px;align-items:center;margin-top:6px;font-size:12px;color:var(--os-ink-2)}
  .vdot{width:3px;height:3px;border-radius:50%;background:var(--os-ink-3);flex-shrink:0}

  .video-timeline{display:flex;flex-direction:column;gap:0;align-items:center}
  .video-segment{display:flex;flex-direction:column;gap:0;align-items:center;width:100%}
  .video-dp-group{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
  .video-dp-label-row{display:flex;align-items:center;gap:8px}
  .video-dp-tag{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;
    color:#fff;background:var(--os-navy);border-radius:4px;padding:2px 7px;flex-shrink:0}
  .video-dp-q{font-size:16px;font-weight:600;color:var(--os-ink-1);max-width:640px;line-height:1.4;text-align:center}
  .video-branches-row{display:flex;gap:20px;flex-wrap:wrap;justify-content:center}
  .video-branch-item{display:flex;flex-direction:column;align-items:center;gap:0}
  .video-arrow-d{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--os-line-strong)}
  .video-arrow-d.retry{color:#b35c00}
  .video-arrow-d.continues{color:#3a6b18}
  .video-arrow-label{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:currentColor;white-space:nowrap}

  .video-clip-card{background:#fff;border:1.5px solid var(--os-line);border-radius:12px;
    width:180px;flex-shrink:0;cursor:pointer;overflow:hidden;transition:.15s}
  .video-clip-card:hover{border-color:var(--os-navy);transform:translateY(-2px);
    box-shadow:0 4px 16px rgba(0,0,0,.1)}
  .video-clip-selected{border-color:var(--os-navy)!important;
    box-shadow:0 0 0 3px rgba(0,37,106,.15)!important}
  .video-clip-branch{opacity:.9}
  .video-clip-thumb{background:#0d1117;aspect-ratio:16/9;position:relative;
    display:flex;align-items:center;justify-content:center}
  .video-clip-scene-badge{position:absolute;top:7px;left:8px;font-size:9px;font-weight:700;
    letter-spacing:.07em;color:rgba(255,255,255,.5);font-family:"JetBrains Mono",monospace}
  .video-clip-play{color:rgba(255,255,255,.4);transition:.15s}
  .video-clip-card:hover .video-clip-play{color:rgba(255,255,255,.9)}
  .video-clip-dur{position:absolute;bottom:6px;right:8px;font-size:9.5px;
    color:rgba(255,255,255,.45);font-family:"JetBrains Mono",monospace}
  .video-clip-answer-icon{position:absolute;top:7px;right:7px;width:28px;height:28px;
    border-radius:50%;display:flex;align-items:center;justify-content:center}
  .video-clip-answer-icon.correct{background:rgba(39,174,96,.25)}
  .video-clip-answer-icon.incorrect{background:rgba(192,57,43,.25)}
  .video-clip-foot{padding:8px 10px 10px}
  .video-clip-type{font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
    color:var(--os-ink-3)}
  .video-clip-text{font-size:11px;color:var(--os-ink-2);margin-top:3px;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.4}

  /* Empty state */
  .empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .empty-card{background:#fff;border:1px dashed var(--os-line-strong);border-radius:14px;
    padding:32px 36px;max-width:480px;text-align:center;pointer-events:auto;box-shadow:var(--shadow-sm)}
  .empty-illust{margin:0 auto 18px;width:88px;height:60px;position:relative}
  .empty-illust div{position:absolute;border-radius:6px;background:#fff;border:1.5px solid var(--os-line-strong)}
  .empty-illust div:nth-child(1){top:8px;left:0;width:42px;height:30px;transform:rotate(-3deg)}
  .empty-illust div:nth-child(2){top:0;left:22px;width:42px;height:34px;background:#fff7ef;border-color:#f5c79b}
  .empty-illust div:nth-child(3){top:14px;left:46px;width:42px;height:30px;transform:rotate(2deg)}
  .empty h2{font-size:17px;color:var(--os-ink);margin:0 0 6px;font-weight:700}
  .empty p{font-size:13px;color:var(--os-ink-2);margin:0;line-height:1.55}

  /* Storyboard rail */
  .rail-head{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
  .rail-h1{font-size:22px;font-weight:900;color:var(--os-ink);margin:0;letter-spacing:-.015em}
  .rail-h1 em{font-style:normal;font-weight:400;color:var(--os-ink-3);font-size:14px;margin-left:8px;letter-spacing:0}
  .rail-meta{display:flex;gap:18px;font-size:12px;color:var(--os-ink-2)}
  .rail-meta b{color:var(--os-ink);font-weight:700}

  .ribbon{display:flex;gap:24px;align-items:stretch;padding-bottom:24px}

  .scene{
    flex-shrink:0;width:1000px;background:#fff;border:1px solid var(--os-line);
    border-radius:12px;box-shadow:var(--shadow-md);position:relative;
    transition:.18s;display:flex;flex-direction:column;cursor:default}
  .scene:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--os-line-strong)}
  .scene.selected{border-color:var(--os-orange);box-shadow:0 0 0 3px rgba(243,111,33,.18), var(--shadow-lg);transform:translateY(-2px)}
  .scene.editing{border-color:var(--os-navy);box-shadow:0 0 0 3px rgba(0,37,105,.14), var(--shadow-lg);transform:translateY(-2px)}
  .scene.editing:hover{transform:translateY(-2px)}

  /* inline-edit fields */
  .edit-field{width:100%;border:1px solid var(--os-line);background:var(--os-bg-2);
    border-radius:6px;padding:6px 8px;font-family:inherit;font-size:inherit;line-height:inherit;
    color:inherit;outline:none;resize:none;transition:.12s}
  .edit-field:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}
  .edit-title{font-size:19px;font-weight:700;color:var(--os-ink);line-height:1.3;padding:9px 11px}
  .edit-tag-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .edit-tag-row select,.edit-tag-row input{padding:6px 10px;font-size:14px;border-radius:5px;
    border:1px solid var(--os-line);background:#fff;font-family:inherit;color:var(--os-ink);outline:none;font-weight:700;
    letter-spacing:.03em;text-transform:uppercase}
  .edit-tag-row input{width:110px;font-family:"JetBrains Mono",monospace;text-transform:none;letter-spacing:0;font-weight:500}
  .edit-actions{display:flex;gap:6px}
  .edit-banner{display:flex;align-items:center;gap:7px;padding:10px 16px;
    background:#eef3ff;color:var(--os-navy);border-bottom:1px solid #d9e2f7;
    font-size:14px;font-weight:700;letter-spacing:.03em}
  .edit-banner .dot{width:6px;height:6px;border-radius:50%;background:var(--os-navy)}
  .scene.flagged::after{content:"";position:absolute;top:-4px;right:-4px;width:14px;height:14px;border-radius:50%;background:var(--os-orange);border:2px solid #fff;box-shadow:var(--shadow-sm)}
  .scene.regenerating{opacity:.55;pointer-events:none}
  .scene-regen-veil{position:absolute;inset:0;background:rgba(255,255,255,.65);backdrop-filter:blur(1.5px);
    border-radius:12px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:8px;z-index:3;
    color:var(--os-orange);font-size:12px;font-weight:700}
  .scene-regen-veil .spin{width:18px;height:18px;border:2.5px solid var(--os-orange);border-right-color:transparent;border-radius:50%;animation:spin .8s linear infinite}

  /* Inline revise popover on a selected scene */
  .revise-pop{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);
    width:340px;background:#fff;border:1px solid var(--os-line);border-radius:12px;
    box-shadow:var(--shadow-lg);padding:14px;z-index:5}
  .revise-pop::before{content:"";position:absolute;top:-7px;left:50%;transform:translateX(-50%) rotate(45deg);
    width:12px;height:12px;background:#fff;border-left:1px solid var(--os-line);border-top:1px solid var(--os-line)}
  .revise-pop h4{margin:0 0 4px;font-size:13px;font-weight:700;color:var(--os-ink)}
  .revise-pop p.hint{margin:0 0 10px;font-size:11.5px;color:var(--os-ink-3);line-height:1.45}
  .revise-pop textarea{width:100%;padding:8px 10px;border:1px solid var(--os-line);border-radius:7px;
    background:var(--os-bg-2);font-size:12.5px;outline:none;resize:none;min-height:60px;line-height:1.45;font-family:inherit}
  .revise-pop textarea:focus{border-color:var(--os-orange);background:#fff;box-shadow:0 0 0 3px rgba(243,111,33,.1)}
  .revise-pop .qs{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 12px}
  .revise-pop .qs button{font-size:11px;padding:4px 8px;border-radius:999px;background:var(--os-bg-3);
    color:var(--os-ink-2);font-weight:600;border:1px solid transparent}
  .revise-pop .qs button:hover{background:#fff;border-color:var(--os-line-strong);color:var(--os-ink)}
  .revise-pop .actions{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px}
  .scene-hd{display:flex;align-items:center;justify-content:space-between;
    padding:14px 20px;border-bottom:1px solid var(--os-line);
    background:linear-gradient(180deg,#fff 0%, #fafbfc 100%);border-radius:12px 12px 0 0}
  .scene-num{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--os-ink-3);
    font-family:"JetBrains Mono",monospace}
  .scene-num b{color:var(--os-orange)}
  .scene-tag{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;
    padding:3px 10px;border-radius:4px;background:#eef7df;color:#4d6e1d}
  .scene-tag.hook,.scene-tag.narrative{background:#fde7d8;color:#a04412}
  .scene-tag.concept{background:#dbe6ff;color:#1a3a8c}
  .scene-tag.demo{background:#eef7df;color:#4d6e1d}
  .scene-tag.problem,.scene-tag.consequence{background:#fff4d1;color:#8a6b00}
  .scene-tag.recap,.scene-tag.resolution{background:#e8e9ed;color:#3d4452}

  .scene-body{padding:20px;flex:1;display:flex;flex-direction:column;gap:14px}
  .scene-title{font-size:20px;font-weight:700;color:var(--os-ink);margin:0;line-height:1.3}

  .scene-block{font-size:16px;line-height:1.55}
  .scene-block-lbl{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;
    color:var(--os-ink-3);margin-bottom:5px;display:flex;align-items:center;gap:5px}
  .scene-block-lbl::before{content:"";width:10px;height:1px;background:var(--os-line-strong)}
  .scene-block.narr p{margin:0;color:var(--os-ink);font-style:italic;font-size:17px;line-height:1.6}
  .scene-block.visual p{margin:0;color:var(--os-ink-2);font-size:16px;line-height:1.55}
  .scene-block.onscreen p{margin:0;color:var(--os-ink-2);font-size:16px;line-height:1.55}
  .scene-block.onscreen p code{background:var(--os-bg-3);padding:1px 5px;border-radius:3px;
    font-family:"JetBrains Mono",monospace;font-size:13px;color:var(--os-navy)}

  .scene-foot{display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:12px 20px;border-top:1px solid var(--os-line);background:#fafbfc;border-radius:0 0 12px 12px}
  .scene-foot-r{display:flex;align-items:center;gap:4px;margin-left:auto}
  .btn-add-dp{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
    color:#1a7a4a;background:#eafaf1;border:1.5px solid #82c99a;border-radius:7px;
    padding:5px 11px;cursor:pointer;transition:.12s;white-space:nowrap}
  .btn-add-dp:hover:not(.btn-add-dp-disabled){background:#d4f0e0;border-color:#4caf72;transform:translateY(-1px)}
  .btn-add-dp-disabled{opacity:.4;cursor:not-allowed}
  .icon-btn{width:30px;height:30px;border-radius:6px;color:var(--os-ink-3);
    display:flex;align-items:center;justify-content:center}
  .icon-btn:hover{background:#fff;color:var(--os-ink);box-shadow:var(--shadow-sm)}

  /* Connector arrow between scenes */
  .connector{display:flex;align-items:center;flex-shrink:0;color:var(--os-line-strong);position:relative}
  .connector::before{content:"";position:absolute;left:-2px;top:50%;width:8px;height:8px;
    border-radius:50%;background:var(--os-line-strong);transform:translateY(-50%)}
  .connector svg{display:block}

  /* Citation marker on scene */
  .citation{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
  .cite{font-size:9.5px;font-family:"JetBrains Mono",monospace;padding:1.5px 5px;
    border-radius:3px;background:var(--os-bg-3);color:var(--os-ink-2);border:1px solid var(--os-line)}

  /* ─── Bottom action bar ─── */
  .actionbar{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);
    background:#fff;border:1px solid var(--os-line);border-radius:14px;
    box-shadow:var(--shadow-lg);padding:10px 14px;display:flex;align-items:center;gap:16px;z-index:4}
  .ab-stat{display:flex;align-items:center;gap:10px;padding-right:14px;border-right:1px solid var(--os-line)}
  .ab-stat-k{font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--os-ink-3)}
  .ab-stat-v{font-size:14px;font-weight:700;color:var(--os-ink);font-variant-numeric:tabular-nums}
  .ab-actions{display:flex;gap:8px;align-items:center}

  /* ─── Generating overlay (script) ─── */
  .gen-overlay{position:absolute;inset:0;background:rgba(255,255,255,.7);
    backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);
    display:flex;align-items:center;justify-content:center;z-index:6}
  .gen-card{background:#fff;border:1px solid var(--os-line);border-radius:14px;
    box-shadow:var(--shadow-lg);padding:28px 32px;width:420px;text-align:center}
  .gen-card h3{font-size:16px;margin:0 0 4px;color:var(--os-ink);font-weight:700}
  .gen-card p{font-size:12.5px;color:var(--os-ink-2);margin:0 0 18px}
  .gen-steps{text-align:left;display:flex;flex-direction:column;gap:9px;margin-bottom:6px}
  .gen-step{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--os-ink-3)}
  .gen-step.done{color:var(--os-ink)}
  .gen-step.active{color:var(--os-orange);font-weight:600}
  .gen-step-i{width:16px;height:16px;border-radius:50%;border:1.5px solid var(--os-line-strong);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .gen-step.done .gen-step-i{background:var(--os-green);border-color:var(--os-green)}
  .gen-step.active .gen-step-i{border-color:var(--os-orange);position:relative}
  .gen-step.active .gen-step-i::after{content:"";position:absolute;inset:1px;border-radius:50%;
    border:1.5px solid var(--os-orange);border-right-color:transparent;animation:spin .8s linear infinite}
  .gen-step.done .gen-step-i svg{display:block;color:#fff}
  .gen-step-i svg{display:none}

  /* ─── Video modal ─── */
  .modal-bg{position:fixed;inset:0;background:rgba(11,26,61,.32);backdrop-filter:blur(6px);
    -webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;z-index:1000}
  .modal{background:#fff;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.25);
    width:640px;max-width:92vw;padding:0;overflow:hidden}
  .modal-hd{padding:22px 26px 14px;border-bottom:1px solid var(--os-line)}
  .modal-hd h3{margin:0 0 4px;font-size:18px;font-weight:700;color:var(--os-ink)}
  .modal-hd p{margin:0;font-size:13px;color:var(--os-ink-2);line-height:1.5}
  .modal-body{padding:20px 26px}
  .modal-foot{padding:14px 26px 20px;display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--os-line);background:var(--os-bg-2)}

  .vid-preview{aspect-ratio:16/9;border-radius:10px;background:
    linear-gradient(135deg,#0b1a3d 0%, #002569 60%, #1a4dbf 100%);
    position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
  .vid-preview::before,.vid-preview::after{content:"";position:absolute;border-radius:50%;filter:blur(40px);opacity:.5}
  .vid-preview::before{width:200px;height:200px;background:var(--os-orange);top:-40px;left:-40px}
  .vid-preview::after{width:160px;height:160px;background:var(--os-green);bottom:-30px;right:-20px}
  .vid-play{position:relative;z-index:2;width:64px;height:64px;border-radius:50%;
    background:rgba(255,255,255,.95);display:flex;align-items:center;justify-content:center;color:var(--os-navy)}
  .vid-meta{position:absolute;bottom:14px;left:16px;color:#fff;font-size:12px;font-weight:600;letter-spacing:.02em;z-index:2}
  .vid-meta b{display:block;font-size:14px;margin-bottom:2px}

  .opt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}
  .opt{padding:12px;border:1px solid var(--os-line);border-radius:9px;cursor:default;background:#fff;transition:.15s}
  .opt:hover{border-color:var(--os-line-strong);background:var(--os-bg-2)}
  .opt.on{border-color:var(--os-navy);background:#f4f7ff;box-shadow:0 0 0 3px rgba(0,37,105,.06)}
  .opt-l{font-size:11px;font-weight:700;color:var(--os-ink-3);letter-spacing:.05em;text-transform:uppercase;margin-bottom:4px}
  .opt-v{font-size:13px;font-weight:700;color:var(--os-ink)}
  .opt-d{font-size:11px;color:var(--os-ink-3);margin-top:3px}

  /* ─── Generate-panel additions (model selector, scenario textarea) ─── */
  .gp-label{display:block;font-size:10.5px;font-weight:700;letter-spacing:.05em;
    text-transform:uppercase;color:var(--os-ink-3);margin:10px 0 5px}
  .gp-models{display:flex;gap:6px}
  .gp-model{flex:1;padding:7px 8px;border:1px solid var(--os-line);border-radius:7px;
    background:#fff;font-size:12px;font-weight:600;color:var(--os-ink-2);transition:.12s}
  .gp-model:hover{border-color:var(--os-line-strong);color:var(--os-ink)}
  .gp-model.on{border-color:var(--os-navy);background:#f4f7ff;color:var(--os-navy);box-shadow:0 0 0 2px rgba(0,37,105,.08)}
  .gp-textarea{width:100%;min-height:78px;padding:8px 10px;border:1px solid var(--os-line);
    border-radius:7px;background:var(--os-bg-2);font-size:12.5px;line-height:1.45;
    resize:vertical;outline:none;font-family:inherit;color:inherit}
  .gp-textarea:focus{border-color:var(--os-navy);background:#fff;box-shadow:0 0 0 3px rgba(0,37,105,.08)}

  /* ─── Overview header (editable script.title / learning_goal / target_audience) ─── */
  .overview{background:#fff;border:1px solid var(--os-line);border-radius:12px;
    padding:24px 28px;margin-bottom:28px;box-shadow:var(--shadow-sm);max-width:1550px}
  .overview-title{font-size:30px;font-weight:900;color:var(--os-ink);margin:0 0 6px;
    letter-spacing:-.015em;line-height:1.2;width:100%;border:0;background:transparent;
    outline:none;font-family:inherit;padding:0}
  .overview-title:focus{box-shadow:0 2px 0 var(--os-orange)}

/* Look up the book + chapter for a section ID like "biology2e:09:9.1". */
function lookupSection(id){
  const [bookId, chapN, secN] = id.split(":");
  const book = CATALOG.find(b => b.id === bookId);
  if (!book) return null;
  const chap = book.chapters.find(c => c.n === chapN);
  if (!chap) return null;
  return {book, chap, secN};
}

/* Build the /api/initial_script request from the section the user selected
   first. The backend takes one (book_title, unit_num) at a time; if multiple
   sections are picked we use the first and let chapter/page narrow it. */
function buildGenerateRequest({selected, model, videoType, userQuery}){
  const firstId = Array.from(selected)[0];
  const hit = firstId && lookupSection(firstId);
  if (!hit) return null;
  return {
    book_title: hit.book.bookTitle,
    unit_num: hit.chap.unit,
    chapter_num: parseInt(hit.chap.n, 10),
    page_num: hit.secN,
    user_query: userQuery,
    model_choice: model,
    video_type: videoType,
  };
}

/* ─── Sidebar tree ─── */
function Sidebar({selected, toggleSec, toggleChap, search, setSearch, filter, setFilter}){
  const [openBooks, setOpenBooks] = useState({biology2e:true});
  const [openChaps, setOpenChaps] = useState({"biology2e:09":true});

  const subjects = ["All","Biology","Chemistry","Physics","Economics","Psychology"];
  const matches = (s) => !search || s.toLowerCase().includes(search.toLowerCase());

  return (
    <aside className="sidebar">
      <div className="sb-head">
        <h2 className="sb-title">Source library</h2>
        <h3 className="sb-h1">Pick chapters &amp; sections to ground the script</h3>
        <label className="sb-search">
          {I.search}
          <input value={search} onChange={e=>setSearch(e.target.value)} placeholder="Search books, chapters, sections…" />
        </label>
      </div>
      <div className="sb-filters">
        {subjects.map(s => (
          <button key={s} className={`sb-chip ${filter===s?"on":""}`} onClick={()=>setFilter(s)}>{s}</button>
        ))}
      </div>

      <div className="sb-list">
        {CATALOG.map(book => {
          const open = openBooks[book.id];
          const chapters = book.chapters;
          const selCount = chapters.reduce((acc,c) => acc + c.secs.filter(s => selected.has(`${book.id}:${c.n}:${s.n}`)).length, 0);
          return (
            <div key={book.id} className="book">
              <div className={`book-row ${open?"open":""}`} onClick={()=>setOpenBooks(o => ({...o,[book.id]:!o[book.id]}))}>
                <div className="book-spine" style={{background:book.color}}/>
                <div className="book-meta">
                  <div className="book-title">{book.title}</div>
                  <div className="book-sub">{book.sub}</div>
                </div>
                <div className={`book-count ${selCount>0?"has":""}`}>{selCount>0?selCount:chapters.length}</div>
                <div className="book-caret">{I.caret}</div>
              </div>

              {open && (
                <div className="chapters">
                  {chapters.map(c => {
                    const key = `${book.id}:${c.n}`;
                    const chapOpen = openChaps[key];
                    const chapSel = c.secs.filter(s => selected.has(`${key}:${s.n}`)).length;
                    return (
                      <div key={c.n} className="chap">
                        <div className={`chap-row ${chapOpen?"open":""}`} onClick={()=>setOpenChaps(o => ({...o,[key]:!o[key]}))}>
                          <span className={`chap-sel ${chapSel===c.secs.length?"all":chapSel>0?"some":""}`}
                            onClick={e=>{e.stopPropagation();toggleChap(book.id,c);}}>
                            {chapSel>0 && <svg width="9" height="9" viewBox="0 0 24 24" fill="none" stroke="#fff" strokeWidth="3.5" strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>}
                          </span>
                          <span className="chap-num">CH {c.n}</span>
                          <span className="chap-name">{c.name}</span>
                          <span className="chap-caret">{I.caret}</span>
                        </div>
                        {chapOpen && (
                          <div className="sections">
                            {c.secs.filter(s => matches(s.t)).map(s => {
                              const id = `${key}:${s.n}`;
                              const on = selected.has(id);
                              return (
                                <div key={s.n} className={`sec-row ${on?"on":""}`} onClick={()=>toggleSec(id)}>
                                  <span className="sec-check">{I.check}</span>
                                  <span className="sec-num">§{s.n}</span>
                                  <span className="sec-name">{s.t}</span>
                                </div>
                              );
                            })}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </aside>
  );
}

/* ─── Sidebar footer · just context pills + generate ─── */
function GeneratePanel({selected, removeSec, onGenerate, busy, hasScript,
                        model, setModel, videoType, setVideoType,
                        userQuery, setUserQuery, genError}){
  const pillsArr = Array.from(selected);
  const queryReady = userQuery.trim().length > 0;
  const canRun = selected.size>0 && queryReady && !busy;
  return (
    <div className="sb-foot">
      <div className="ctx-tag">
        <span>Context · {selected.size} section{selected.size===1?"":"s"}</span>
        {selected.size>0 && <span>{Math.min(99, selected.size*4)}k tokens</span>}
      </div>

      {pillsArr.length===0 ? (
        <div className="ctx-empty">Select sections from the library above</div>
      ) : (
        <div className="ctx-pills">
          {pillsArr.slice(0,12).map(id => {
            const [b,c,s] = id.split(":");
            return (
              <span key={id} className="ctx-pill">
                §{s}
                <button onClick={()=>removeSec(id)} aria-label="Remove">×</button>
              </span>
            );
          })}
          {pillsArr.length>12 && <span className="ctx-pill" style={{background:"#f3f5f8",color:"#5e6a71"}}>+{pillsArr.length-12}</span>}
        </div>
      )}

      <label className="gp-label">Scenario description</label>
      <textarea className="gp-textarea" value={userQuery}
        onChange={e=>setUserQuery(e.target.value)}
        placeholder="What scenario should the script dramatize? e.g. A nursing student watches a patient's glucose metabolism in real time."/>

      <label className="gp-label">Video type</label>
      <div className="gp-models">
        <button type="button" className={`gp-model ${videoType==="scenario"?"on":""}`}
          onClick={()=>setVideoType("scenario")}>
          <span style={{display:"block",fontSize:"1.1em",marginBottom:2}}>🎬</span>
          Veo · Scenario
        </button>
        <button type="button" className={`gp-model ${videoType==="manim"?"on":""}`}
          onClick={()=>setVideoType("manim")}>
          <span style={{display:"block",fontSize:"1.1em",marginBottom:2}}>📊</span>
          Manim · Graphics
        </button>
      </div>

      <label className="gp-label">Model</label>
      <div className="gp-models">
        <button type="button" className={`gp-model ${model==="anthropic"?"on":""}`}
          onClick={()=>setModel("anthropic")}>Anthropic</button>
        <button type="button" className={`gp-model ${model==="gemini"?"on":""}`}
          onClick={()=>setModel("gemini")}>Gemini</button>
      </div>

      <button className="btn btn-primary btn-full" disabled={!canRun} onClick={onGenerate} style={{marginTop:12}}>
        {busy ? <><span className="spin"/>Generating…</> : <>{I.sparkle} {hasScript?"Generate new script":"Generate script"}</>}
      </button>

      {genError && <div className="gen-error">{genError}</div>}

      {hasScript && (
        <p style={{fontSize:11,color:"var(--os-ink-3)",margin:"10px 0 0",lineHeight:1.5,textAlign:"center"}}>
          Tip — click the pencil on any scene, character, or choice to edit it manually.
        </p>
      )}
    </div>
  );
}

/* ─── Scene card ───
   Backend scene shape:
   { scene_id, type, scene_summary, duration_seconds, setting,
     character_actions, camera:{angle,movement,lens_effect},
     audio:{dialogue:[{character_id,line}], sound_effects, ambience},
     routes_to:{decision_point_id, type} } */
function fmtDuration(secs){
  if (secs == null) return "—";
  const m = Math.floor(secs / 60), s = secs % 60;
  return m > 0 ? `${m}:${String(s).padStart(2,"0")}` : `${s}s`;
}
function characterName(characters, id){
  const c = (characters || []).find(c => c.character_id === id);
  return c ? c.name : id;
}

      <div className="dp-id">DP {dp.decision_point_id} · intro scene {dp.associated_introduction_scene_id ?? "—"}</div>

/* ─── Build tree segments from flat scenes + decision points ─── */
function buildTreeSegments(scenes, decisionPoints) {
  if (!scenes || scenes.length === 0) return [];
  const dps = decisionPoints || [];
  const dpMap = new Map(dps.map(dp => [dp.decision_point_id, dp]));
  const sceneMap = new Map(scenes.map(s => [s.scene_id, s]));

  // Scenes that are direct targets of DP choices are "branch" scenes, not trunk
  const branchSceneIds = new Set(
    dps.flatMap(dp => (dp.choices || []).map(c => c.routes_to_scene).filter(x => x != null))
  );
  const trunk = scenes.filter(s => !branchSceneIds.has(s.scene_id));

  const dpIntroCount = {};
  for (const s of trunk) {
    const id = s.routes_to?.decision_point_id;
    if (id != null) dpIntroCount[id] = (dpIntroCount[id] || 0) + 1;
  }

  const visited = new Set();
  const addedDps = new Set();
  const dpIntroSeen = {};
  const rawSegs = [];

  for (const scene of trunk) {
    if (visited.has(scene.scene_id)) continue;
    rawSegs.push({kind:"scene", scene});
    visited.add(scene.scene_id);

    const dpId = scene.routes_to?.decision_point_id;
    if (dpId != null && !addedDps.has(dpId)) {
      dpIntroSeen[dpId] = (dpIntroSeen[dpId] || 0) + 1;
      if (dpIntroSeen[dpId] >= (dpIntroCount[dpId] || 1)) {
        const dp = dpMap.get(dpId);
        if (dp) {
          addedDps.add(dpId);
          const branches = (dp.choices || []).map(c => ({
            choice: c,
            scene: c.routes_to_scene != null ? sceneMap.get(c.routes_to_scene) : null,
          }));
          branches.forEach(b => { if (b.scene) visited.add(b.scene.scene_id); });
          rawSegs.push({kind:"branch", dp, branches});
        }
      }
    }
  }

  for (const scene of scenes) {
    if (!visited.has(scene.scene_id)) rawSegs.push({kind:"scene", scene});
  }

  // Group consecutive trunk scenes into horizontal rows
  const segments = [];
  let trunkGroup = null;
  for (const seg of rawSegs) {
    if (seg.kind === "scene") {
      if (!trunkGroup) { trunkGroup = {kind:"trunk", scenes:[]}; segments.push(trunkGroup); }
      trunkGroup.scenes.push(seg.scene);
    } else {
      trunkGroup = null;
      segments.push(seg);
    }
  }
  return segments;
}

/* ─── Decision Tree View ─── */
function TreeView({script, density, viewMode, editingSceneIdx, setEditingSceneIdx, saveSceneEdit, deleteScene, moveScene, updateDecisionPoint, addDecisionPoint}){
  const scenes = script.scenes || [];
  const dps = script.decision_points || [];
  const characters = script.characters || [];
  const sceneIdxMap = new Map(scenes.map((s,i) => [s.scene_id, i]));
  const segments = buildTreeSegments(scenes, dps);
  const [editingChoice, setEditingChoice] = useState(null); // {dpId, idx} | null
  const [editingDPQ, setEditingDPQ] = useState(null); // dpId | null

  const getDpIdx = (dpId) => dps.findIndex(d => d.decision_point_id === dpId);

  const setCorrectChoice = (dpId, choiceIdx) => {
    const dpIdx = getDpIdx(dpId);
    if (dpIdx < 0 || !updateDecisionPoint) return;
    const dp = dps[dpIdx];
    updateDecisionPoint(dpIdx, {...dp, choices: dp.choices.map((c,i) => ({...c, is_correct: i===choiceIdx}))});
  };
  const saveChoiceText = (dpId, choiceIdx, text) => {
    const dpIdx = getDpIdx(dpId);
    if (dpIdx < 0 || !updateDecisionPoint) return;
    const dp = dps[dpIdx];
    updateDecisionPoint(dpIdx, {...dp, choices: dp.choices.map((c,i) => i===choiceIdx ? {...c, text} : c)});
    setEditingChoice(null);
  };
  const saveQuestionText = (dpId, text) => {
    const dpIdx = getDpIdx(dpId);
    if (dpIdx < 0 || !updateDecisionPoint) return;
    updateDecisionPoint(dpIdx, {...dps[dpIdx], question_text: text});
    setEditingDPQ(null);
  };

  return (
    <div className="tree-view">
      {segments.map((seg, si) => {
        if (seg.kind === "trunk") {
          return (
            <div key={`trunk-${si}`} className="tree-node">
              {si > 0 && <div className="tree-vline"/>}
              <div className="ribbon" style={{flexWrap:"wrap",justifyContent:"center",paddingBottom:0}}>
                {seg.scenes.map((s, i) => {
                  const idx = sceneIdxMap.get(s.scene_id) ?? -1;
                  const prevIdx = i > 0 ? (sceneIdxMap.get(seg.scenes[i-1].scene_id) ?? -1) : -1;
                  const nextIdx = i < seg.scenes.length-1 ? (sceneIdxMap.get(seg.scenes[i+1].scene_id) ?? -1) : -1;
                  return (
                    <Fragment key={s.scene_id ?? i}>
                      {i > 0 && <div className="connector">{I.arrow}</div>}
                      <SceneCard s={s} characters={characters} decisionPoints={dps}
                        density={density} viewMode={viewMode}
                        isEditing={editingSceneIdx===idx}
                        onStartEdit={()=>setEditingSceneIdx(idx)}
                        onCancelEdit={()=>setEditingSceneIdx(null)}
                        onSaveEdit={(draft)=>saveSceneEdit(idx, draft)}
                        onDelete={()=>deleteScene(idx)}
                        onMoveLeft={prevIdx>=0 ? ()=>moveScene(idx,prevIdx) : undefined}
                        onMoveRight={nextIdx>=0 ? ()=>moveScene(idx,nextIdx) : undefined}
                        onAddDP={()=>addDecisionPoint(idx)}
                        addDPDisabled={s.routes_to?.decision_point_id!=null}/>
                    </Fragment>
                  );
                })}
              </div>
            </div>
          );
        }

        if (seg.kind === "branch") {
          return (
            <div key={`dp-${seg.dp.decision_point_id}`} className="tree-branch-frame">
              <div className="tree-vline"/>
              <div className="tree-dp-node">
                <div className="tree-dp-badge">Decision Point {seg.dp.decision_point_id}</div>
                {editingDPQ === seg.dp.decision_point_id ? (
                  <DPInlineEdit
                    value={seg.dp.question_text}
                    onSave={text=>saveQuestionText(seg.dp.decision_point_id, text)}
                    onCancel={()=>setEditingDPQ(null)}
                    placeholder="Question text"/>
                ) : (
                  <div className="tree-dp-question" onClick={()=>setEditingDPQ(seg.dp.decision_point_id)}
                    title="Click to edit question" style={{cursor:"text"}}>
                    {seg.dp.question_text}
                    <span className="dp-edit-hint">{I.edit}</span>
                  </div>
                )}
              </div>
              <div className="tree-branch-row">
                {seg.branches.map((b, bi) => {
                  const i = b.scene ? (sceneIdxMap.get(b.scene.scene_id) ?? -1) : -1;
                  return (
                    <div key={b.choice.choice_id ?? bi} className="tree-branch-col">
                      <div className="tree-vline-sm"/>
                      <div className={`choice-pill ${b.choice.is_correct ? "correct-pill" : "wrong-pill"}`}>
                        <div className="choice-pill-hd">
                          <span className="choice-id-label">{b.choice.choice_id}</span>
                          {b.choice.is_correct ? (
                            <span className="correct-badge">✓ Correct answer</span>
                          ) : (
                            <button className="mark-correct-btn"
                              onClick={() => setCorrectChoice(seg.dp.decision_point_id, bi)}
                              title="Mark as correct answer">
                              Mark as correct
                            </button>
                          )}
                          <button className="icon-btn" style={{width:22,height:22,marginLeft:"auto"}}
                            title="Edit choice text"
                            onClick={()=>setEditingChoice({dpId:seg.dp.decision_point_id, idx:bi})}>
                            {I.edit}
                          </button>
                        </div>
                        {editingChoice?.dpId===seg.dp.decision_point_id && editingChoice?.idx===bi ? (
                          <DPInlineEdit
                            value={b.choice.text}
                            onSave={text=>saveChoiceText(seg.dp.decision_point_id, bi, text)}
                            onCancel={()=>setEditingChoice(null)}
                            placeholder="Choice text"/>
                        ) : (
                          <span className="choice-text">{b.choice.text}</span>
                        )}
                      </div>
                      {b.scene ? (
                        <>
                          <div className="tree-vline-sm"/>
                          <div className="tree-branch-scene-wrap">
                            <SceneCard s={b.scene} characters={characters} decisionPoints={dps}
                              density="compact" viewMode={viewMode}
                              isEditing={editingSceneIdx===i}
                              onStartEdit={()=>setEditingSceneIdx(i)}
                              onCancelEdit={()=>setEditingSceneIdx(null)}
                              onSaveEdit={(draft)=>saveSceneEdit(i, draft)}
                              onDelete={()=>deleteScene(i)}/>
                          </div>
                          {b.choice.is_correct
                            ? <div className="continues-badge">↓ continues</div>
                            : <div className="retry-badge">↺ returns to decision point</div>}
                        </>
                      ) : (
                        <div style={{fontSize:11,color:"var(--os-ink-3)",fontStyle:"italic",padding:"10px 0"}}>no scene linked</div>
                      )}
                    </div>
                  );
                })}
              </div>
            </div>
          );
        }

        return null;
      })}
    </div>
  );
}

/* ─── Export helpers ─── */
function exportJSON(script) {
  const blob = new Blob([JSON.stringify(script, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "scenario_script.json"; a.click();
  URL.revokeObjectURL(url);
}

function exportMarkdown(script) {
  const lines = [];
  lines.push(`# ${script.title || "Untitled Script"}\n`);
  lines.push(`**Scenes:** ${(script.scenes||[]).length} · **Characters:** ${(script.characters||[]).length} · **Decision Points:** ${(script.decision_points||[]).length}\n`);
  if (script.learning_objective) lines.push(`**Learning Objective:** ${script.learning_objective}\n`);
  lines.push("---\n");
  (script.scenes || []).forEach((s, i) => {
    lines.push(`## Scene ${i+1}: ${s.title || s.scene_id}`);
    if (s.setting?.description) lines.push(`\n*Setting:* ${s.setting.description}`);
    if (s.setting?.location) lines.push(`*Location:* ${s.setting.location}`);
    lines.push("");
    (s.audio?.dialogue || []).forEach(dl => {
      lines.push(`**${dl.character_id}:** ${dl.line}`);
    });
    if (s.routes_to?.decision_point_id != null) lines.push(`\n*→ Routes to Decision Point ${s.routes_to.decision_point_id}*`);
    lines.push("\n---\n");
  });
  if ((script.decision_points||[]).length > 0) {
    lines.push("## Decision Points\n");
    (script.decision_points).forEach(dp => {
      lines.push(`### DP ${dp.decision_point_id}: ${dp.question_text}`);
      (dp.choices||[]).forEach(c => {
        lines.push(`- ${c.is_correct?"✓":"✗"} **${c.choice_id}:** ${c.text}`);
      });
      lines.push("");
    });
  }
  const blob = new Blob([lines.join("\n")], {type:"text/markdown"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = "scenario_script.md"; a.click();
  URL.revokeObjectURL(url);
}

function exportPDF(script) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({orientation:"portrait", unit:"mm", format:"a4"});
  const pageW = 210; const margin = 18; const usableW = pageW - margin * 2;
  let y = margin;

  const checkPage = (needed=10) => {
    if (y + needed > 287) { doc.addPage(); y = margin; }
  };
  const writeLine = (text, size=10, style="normal", color=[30,35,48]) => {
    doc.setFontSize(size); doc.setFont("helvetica", style); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(text, usableW);
    checkPage(lines.length * (size * 0.4 + 1));
    doc.text(lines, margin, y); y += lines.length * (size * 0.4 + 1) + 1;
  };
  const rule = () => { checkPage(4); doc.setDrawColor(200,205,215); doc.line(margin, y, pageW-margin, y); y += 5; };

  // Header
  doc.setFillColor(0, 37, 105);
  doc.rect(0, 0, pageW, 28, "F");
  doc.setFontSize(16); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
  doc.text(script.title || "Untitled Script", margin, 13);
  doc.setFontSize(9); doc.setFont("helvetica","normal"); doc.setTextColor(180,200,240);
  const meta = `${(script.scenes||[]).length} scenes · ${(script.characters||[]).length} characters · ${(script.decision_points||[]).length} decision points`;
  doc.text(meta, margin, 21);
  y = 36;

  if (script.learning_objective) {
    writeLine("Learning Objective", 9, "bold", [100,110,130]);
    writeLine(script.learning_objective, 10, "normal");
    y += 3;
  }

  // Scenes
  (script.scenes || []).forEach((s, i) => {
    rule();
    writeLine(`Scene ${i+1}: ${s.title || s.scene_id}`, 12, "bold", [0,37,105]);
    if (s.setting?.description) writeLine(s.setting.description, 9, "italic", [90,100,115]);
    y += 2;
    (s.audio?.dialogue || []).forEach(dl => {
      checkPage(8);
      doc.setFontSize(9); doc.setFont("helvetica","bold"); doc.setTextColor(80,90,110);
      doc.text(`${dl.character_id}:`, margin, y);
      const nameW = doc.getTextWidth(`${dl.character_id}:`) + 3;
      doc.setFont("helvetica","normal"); doc.setTextColor(30,35,48);
      const spoken = doc.splitTextToSize(dl.line, usableW - nameW);
      doc.text(spoken, margin + nameW, y);
      y += spoken.length * 5 + 1;
    });
    if (s.routes_to?.decision_point_id != null) {
      y += 1; writeLine(`→ Routes to Decision Point ${s.routes_to.decision_point_id}`, 8, "italic", [120,130,150]);
    }
  });

  // Decision Points
  if ((script.decision_points||[]).length > 0) {
    rule();
    writeLine("Decision Points", 13, "bold", [0,37,105]);
    (script.decision_points).forEach(dp => {
      y += 3; checkPage(12);
      writeLine(`DP ${dp.decision_point_id}: ${dp.question_text}`, 10, "bold");
      (dp.choices||[]).forEach(c => {
        writeLine(`  ${c.is_correct?"✓":"○"} ${c.choice_id}: ${c.text}`, 9, c.is_correct?"bold":"normal",
          c.is_correct?[40,120,40]:[60,70,85]);
      });
    });
  }

  doc.save("scenario_script.pdf");
}
